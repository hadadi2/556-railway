# أسعار باقات المنصّة — ريال سعودي (إعادة تسعير سوقية بطلب المالك 2026-08-18:
# «اعد تصميم الباقات بناء على تسعيرة السوق وخلي فيه خصم عن الاشتراك السنوي» —
# تعدّل أرقام 2026-08-17).
#
# منطق التسعيرة السوقية (موثّق للمراجعة، والمالك يعدّل الأرقام بلا كود):
# دراسة سوق واحدة من بيت خبرة تكلف عادةً 15,000+ ر.س وتستغرق أسابيع؛ أدوات
# ذكاء الأسواق العالمية (اشتراك شهري) تتراوح بين ~500 و~2,000 ر.س شهرياً.
# الأسعار أدناه مراسٍ سوقية (x99) قرب المستوى المُقرّ سابقاً، وتضع كلفة
# الدراسة الواحدة بين ~300 و~350 ر.س — جزءاً يسيراً من سعر بيوت الخبرة.
#
# الخصم السنوي: السنوي = 10 أشهر (شهران مجاناً ≈ خصم 17%) — العرف السائد في
# اشتراكات SaaS. نسبة «وفّر %» تُشتق تلقائياً من الأرقام نفسها في
# GET /platform/pricing — لا حقل نسبة يدوي هنا قد ينحرف عن الحقيقة.
# باقة بلا سعر سنوي (0) = السنوي غير معروض لها ويرفضه الخادم.
#
# نفس صيغة branding.yaml المبسّطة عمداً (key: value مسطّح فقط) — يقرؤها محلّل
# stdlib خفيف في `silk_platform/pricing.py`، لا PyYAML (اتفاق stdlib-first).
# عدّل الأرقام هنا مباشرة — صفحة الهبوط وصفحة الدفع تقرآنها عبر
# GET /platform/pricing وقت التشغيل، فلا حاجة لأي تعديل كود.
#
# حصص الدراسات/المقاعد ليست هنا عمداً — مصدرها الواحد models.TIER_LIMITS
# (نقطة /platform/pricing تدمج الاثنين في ردّ واحد).

currency: SAR
billing_cycle: monthly

# شهرياً · monthly (ر.س)
basic_price: 0
silver_price: 699
gold_price: 1799

# سنوياً · annual (ر.س/سنة = 10 أشهر — شهران مجاناً)
basic_price_annual: 0
silver_price_annual: 6990
gold_price_annual: 17990
