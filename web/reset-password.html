<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سِلك — إعادة تعيين كلمة المرور</title>
<!-- خطوط مستضافة ذاتياً — نفس ملفات المنصّة، لا CDN خارجي (CSP صارمة). -->
<!-- أيقونة الهبوط نفسها (#202) — تُصلح 404 الأيقونة المرصود في فحص المتصفح الحي. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181B'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M7.5 16h17M16 7.5c3.2 2.6 3.2 14.4 0 17-3.2-2.6-3.2-14.4 0-17z' fill='none' stroke='white' stroke-width='1.4'/%3E%3Ccircle cx='23.5' cy='8.5' r='3.2' fill='%23C9A227'/%3E%3C/svg%3E">
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  /* لوحة المنصّة المحايدة — من مفاتيح platform_* في config/branding.yaml
     (18181B/09090B/3F3F46)؛ التقارير الرسمية تبقى كحلية. */
  :root{
    --bg:#F2F4F8;--panel:#FFFFFF;--ink:#101828;--muted:#667085;
    --line:#DCE3EB;--line-2:#EDF1F6;
    --pri:#18181B;--pri-dark:#09090B;--pri-soft:#F4F4F5;--sky:#3F3F46;
    --gold:#C9A227;
    --ok:#054F31;--ok-soft:#D1FADF;--bad:#B42318;--bad-soft:#FEE4E2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);min-height:100vh;
    font-family:"Cairo","IBM Plex Sans Arabic",sans-serif;line-height:1.6}
  .card{max-width:400px;margin:8vh auto 0;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:30px 26px}
  h1{font-size:24px;font-weight:700;color:var(--pri)}
  p.sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
  label{display:block;font-size:12px;color:#475467;font-weight:600;
    margin:12px 0 5px}
  input{font-family:inherit;width:100%;padding:9px 11px;
    border:1px solid var(--line);border-radius:6px;font-size:13.5px}
  input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(14,165,233,.28)}
  button{font-family:inherit;cursor:pointer;border:none;font-weight:600;
    background:var(--pri);color:#fff;border-radius:6px;padding:10px 16px;
    font-size:13.5px;width:100%;margin-top:18px}
  button:hover{background:var(--pri-dark)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .msg{font-size:12.5px;padding:10px 13px;border-radius:6px;margin:0 0 8px;
    display:none;line-height:1.6}
  .msg.on{display:block}
  .msg.err{background:var(--bad-soft);color:var(--bad)}
  .msg.good{background:var(--ok-soft);color:var(--ok)}
  .hint{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.6}
  a{color:var(--pri)}
  .foot{font-size:11.5px;color:var(--muted);text-align:center;
    border-top:1px solid var(--line-2);padding-top:10px;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <h1 style="display:flex;justify-content:space-between;align-items:center">سِلك
    <button id="langBtn" style="width:auto;margin:0;padding:5px 12px;
      font-size:12px;background:#fff;color:var(--pri);
      border:1.5px solid var(--line)">English</button></h1>
  <p class="sub" data-i18n="sub">إعادة تعيين كلمة المرور</p>
  <div id="msg" class="msg"></div>
  <div id="form">
    <label for="pw1" data-i18n="pw1_l">كلمة المرور الجديدة</label>
    <input id="pw1" type="password" autocomplete="new-password" dir="ltr">
    <label for="pw2" data-i18n="pw2_l">تأكيد كلمة المرور</label>
    <input id="pw2" type="password" autocomplete="new-password" dir="ltr">
    <button id="go" data-i18n="go_b">تعيين كلمة المرور</button>
    <p class="hint" data-i18n="policy">السياسة: ٨ أحرف على الأقل، بحرف كبير وصغير ورقم. الرمز في
      الرابط أحاديّ الاستخدام وينتهي بعد ٣٠ دقيقة — وعند النجاح تُبطَل كل
      الجلسات القائمة.</p>
  </div>
  <div id="done" style="display:none">
    <p style="font-size:13.5px;margin-top:8px"><span data-i18n="done_t">عُيِّنت
      كلمة المرور الجديدة.</span>
      <a href="/platform.html" data-i18n="done_a">الدخول إلى المنصّة ←</a></p>
  </div>
  <p class="foot" data-i18n="foot">سِلك لذكاء الأسواق — منصة تحليل أسواق التصدير السعودية</p>
</div>

<script>
"use strict";
/* صفحة مستقلّة عمداً: تُفتَح من رابط بريدٍ خارج أي جلسة، فلا تعتمد على
   platform.html ولا على رمز دخول — الرمز في الرابط هو الاعتماد الوحيد،
   والنقطة `POST /platform/auth/password-reset/confirm` عامّة بطبيعتها. */
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get("token") || "";
/* R7 (SEC-6): الرمزُ لا يبقى في شريط العنوان ولا في التاريخ ولا في المُحيل بعد قراءته. */
if (token) { try { history.replaceState(null, "", location.pathname); } catch (_e) { /* بيئةٌ بلا history */ } }

/* لغتان — نفس نمط بقية الصفحات: العربية مؤلَّفة، الإنجليزية وقت التشغيل. */
var I18N_EN = {
  sub: "Reset your password",
  pw1_l: "New password", pw2_l: "Confirm password", go_b: "Set password",
  policy: "Policy: at least 8 characters with upper, lower and a digit. The " +
          "link token is single-use and expires after 30 minutes — on " +
          "success all existing sessions are revoked.",
  done_t: "Your new password is set.", done_a: "Enter the platform →",
  foot: "Silk Market Intelligence — Saudi export market analysis platform",
};
var LANG = "ar";
var AR_ORIG = {};
document.querySelectorAll("[data-i18n]").forEach(function (el) {
  AR_ORIG[el.getAttribute("data-i18n")] = el.textContent;
});
var tr = function (ar, en) { return LANG === "en" ? en : ar; };
function setLang(lang) {
  LANG = lang === "en" ? "en" : "ar";
  try { localStorage.setItem("silk_lang", LANG); } catch (e) { /* خصوصية */ }
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "en" ? "ltr" : "rtl";
  document.querySelectorAll("[data-i18n]").forEach(function (el) {
    var k = el.getAttribute("data-i18n");
    var v = LANG === "en" ? I18N_EN[k] : AR_ORIG[k];
    if (v != null) el.textContent = v;
  });
  $("langBtn").textContent = LANG === "en" ? "العربية" : "English";
}
$("langBtn").onclick = function () { setLang(LANG === "en" ? "ar" : "en"); };
try {
  if (localStorage.getItem("silk_lang") === "en") setLang("en");
} catch (e) { /* وضع خصوصية */ }

function say(text, kind) {
  const el = $("msg");
  el.textContent = text;
  el.className = "msg on " + (kind || "");
}

if (!token) {
  say(tr("الرابط ناقص رمز إعادة التعيين — افتح الرابط من رسالة البريد كما هو، أو اطلب رابطاً جديداً من شاشة الدخول.",
         "The link is missing the reset token — open the link from the email as-is, or request a new one from the sign-in screen."), "err");
  $("go").disabled = true;
}

$("go").onclick = async () => {
  const p1 = $("pw1").value, p2 = $("pw2").value;
  if (!p1) { say(tr("أدخِل كلمة المرور الجديدة.", "Enter the new password."), "err"); return; }
  if (p1 !== p2) { say(tr("الكلمتان غير متطابقتين.", "The passwords do not match."), "err"); return; }
  $("go").disabled = true;
  try {
    const r = await fetch("/platform/auth/password-reset/confirm", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({token: token, new_password: p1})
    });
    let body = null;
    try { body = await r.json(); } catch (_e) { /* ردٌّ بلا JSON */ }
    if (!r.ok) {
      const d = body && body.detail;
      say(r.status === 400
        ? tr("الرمز غير صالح أو استُعمل أو انتهت مدّته — اطلب رابطاً جديداً من شاشة الدخول.",
             "The token is invalid, used, or expired — request a new link from the sign-in screen.")
        : (typeof d === "string" ? d
           /* مراجعة R6: الرفضُ المنظَّم `{error, message}` — سياسةُ كلمة المرور بلغة الزائر،
              وغيرُها برسالة الخادم بدل «HTTP 422» المبهم. */
           : (d && d.error === "password_policy")
             ? tr("كلمة المرور لا تستوفي السياسة: ٨ أحرف على الأقلّ مع حرف صغير وحرف كبير ورقم.",
                  "Password must have at least 8 characters with a lowercase letter, an uppercase letter and a digit.")
           : (d && d.message) ? d.message
           : tr("تعذّر التعيين (HTTP ", "Could not set it (HTTP ") + r.status + ")"),
        "err");
      $("go").disabled = false;
      return;
    }
    $("form").style.display = "none";
    $("done").style.display = "block";
    say(tr("تمّ — استعمل كلمتك الجديدة للدخول.",
           "Done — use your new password to sign in."), "good");
  } catch (e) {
    say(tr("تعذّر الاتصال بالخادم — أعِد المحاولة.",
           "Could not reach the server — try again."), "err");
    $("go").disabled = false;
  }
};
$("pw2").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });
</script>
</body>
</html>
