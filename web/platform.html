<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سِلك — منصّة المصانع</title>
<!-- خطوط مستضافة ذاتياً — نفس ملفات الواجهة الرئيسة، لا CDN خارجي. -->
<!-- أيقونة الهبوط نفسها (#202) — تُصلح 404 الأيقونة المرصود في فحص المتصفح الحي. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181B'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M7.5 16h17M16 7.5c3.2 2.6 3.2 14.4 0 17-3.2-2.6-3.2-14.4 0-17z' fill='none' stroke='white' stroke-width='1.4'/%3E%3Ccircle cx='23.5' cy='8.5' r='3.2' fill='%23C9A227'/%3E%3C/svg%3E">
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  /* ═══ الاتجاه «ج · أداة عمل» — اختيار المالك ═══════════════════════════════
     فاتح عالي التباين، شريط أدوات ثابت، أزرار صريحة، جدول كثيف. القاعدة التي
     أنتجت هذا الشكل: الشاشة السابقة كانت تعرض ولا تُنجِز (٢٩ نقطة كتابة في
     الـAPI مقابل زرَّي دخول/خروج)، فبدت «مستنداً» وسأل المالك «كيف أستعمل؟».
     فكلّ فعلٍ ممكن هنا **مرئيٌّ في شريط أدوات** لا مخفيّاً في قائمة. */
  /* ═══ طبقة الرموز · design tokens ══════════════════════════════════════
     ثلاث طبقات (sumi/design-systems-architecture): قيم خام ← دلالية ← مكوّن.
     **قرار المالك 2026-08-20 ينسخ «نمط Stripe» (2026-08-18).** ما كان هنا
     لوحة Stripe الحرفية (635BFF نيلي + 1A1F36 حبر + E3E8EE حدود) — هوية
     شركة أخرى شُحنت في منتجنا. اللوحة المعتمدة أزرق سِلك 2563EB بسلّمه، وكل
     درجة مرآةٌ لمفتاح `dashboard_*` في `config/branding.yaml` (الحارس
     `test_platform_cost_visibility` يطابقها ميكانيكياً — لا قيمة تُكتب هنا
     بلا مصدر في ملف الهوية).
     الذهبي C9A227 **ليس لون واجهة** (البند ٢ من أمر المالك): مخطط وعلامة
     هوية فقط — ممنوع في الشريط والأزرار وCTA والحالة النشطة والبطاقات. */
  :root{
    /* ── سطوح ونصّ (دلالي) ── */
    --bg:#F8FAFC;--panel:#FFFFFF;--ink:#111827;--ink-soft:#334155;
    --muted:#64748B;--line:#E2E8F0;--line-2:#EEF2F7;--zebra:#F8FAFC;
    /* ── أزرق سِلك: فعل · تنقّل · نشط · روابط · focus · تقدّم · محدَّد ── */
    --pri:#2563EB;--pri-dark:#1D4ED8;--pri-active:#1E40AF;
    --pri-soft:#EFF6FF;--pri-light:#DBEAFE;--pri-line:var(--pri-light);
    --on-pri:#FFFFFF;
    /* ── الذهبي: بيانات وعلامة هوية فقط ── */
    --gold:#C9A227;--gold-soft:#F6F0DC;--gold-ink:#7A6114;
    /* ── دلالات الحالة ── */
    --ok:#054F31;--ok-soft:#D1FADF;--warn:#93370D;--warn-soft:#FEF0C7;
    --bad:#B42318;--bad-soft:#FEE4E2;--bad-line:#F2C4C0;
    /* ── الشريط الجانبي ── */
    --side:#FFFFFF;--side-ink:#334155;--side-hover:#F1F5F9;--side-line:#E2E8F0;
    --sidew:248px;
    /* ── المسافات: أساس-4 (sumi/design-token-presets) ── */
    --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;
    --sp-8:32px;--sp-10:40px;--sp-12:48px;
    /* ── الطباعة: عربية أولاً، لا شيء تحت 13px (أمر المالك، البند ٩) ── */
    --fs-meta:13px;--fs-body:15px;--fs-table:14px;--fs-nav:14px;
    --fs-group:13px;--fs-sect:19px;--fs-page:26px;--fs-kpi:28px;
    /* العربية تحتاج رصاصاً أعلى من اللاتيني — قرار مشتق (مهارات التصميم
       المرجعية لاتينية بحتة؛ الغياب معلن في وثيقة القرار). */
    --lh-text:1.7;--lh-ui:1.5;
    /* ── الحواف والظلال والحركة ── */
    --r-sm:4px;--r-md:8px;--r-lg:12px;
    --shadow-sm:0 1px 2px rgba(17,24,39,.06);
    --shadow-md:0 8px 20px rgba(17,24,39,.10);
    --dur-fast:150ms;--dur-norm:250ms;   /* norm: انتقالات الألواح */
  }
  @media(prefers-reduced-motion:reduce){
    :root{--dur-fast:0ms;--dur-norm:0ms}
    *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);min-height:100vh;
    font-family:"Cairo","IBM Plex Sans Arabic",sans-serif;line-height:1.6;
    -webkit-font-smoothing:antialiased}
  .num{font-family:"IBM Plex Mono",monospace;font-feature-settings:"tnum";
    direction:ltr;unicode-bidi:plaintext}
  .hide{display:none!important}
  button{font-family:inherit;cursor:pointer;border:none;font-weight:600}
  input,select,textarea{font-family:inherit;width:100%;padding:9px 11px;
    border:1px solid var(--line);border-radius:var(--r-md);font-size:var(--fs-table);
    background:#fff;color:var(--ink)}
  textarea{min-height:88px;resize:vertical;line-height:1.7}
  input:focus,select:focus,textarea:focus{outline:none;
    border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-light)}
  /* دليل التركيز صلبٌ لا هالة شفّافة: الهالة السابقة كانت 1.6:1 على
     الأبيض — غير مرئية فعلياً لمن يتنقّل بلوحة المفاتيح (فحص 2026-08-20). */
  :focus-visible{outline:2px solid var(--pri);outline-offset:2px}
  label{display:block;font-size:var(--fs-meta);color:var(--ink-soft);font-weight:600;
    margin:12px 0 5px}
  .btn{background:var(--pri);color:var(--on-pri);border-radius:var(--r-md);
    padding:10px 16px;font-size:var(--fs-table);
    /* الوسمان <a> في بطاقة الباقة كانا سطريَّين: الحشو الرأسي بلا أثر
       والزرّان يتلاصقان بلا فجوة (فحص 2026-08-20). */
    display:inline-flex;align-items:center;justify-content:center;
    gap:6px;text-decoration:none}
  /* الهوامش لوسمَي <a> في بطاقة الباقة وحدهما — وضعُها على `.btn` العامّة
     كان يمنح كلّ زرّ في الصفحة هامشاً علوياً وجانبياً (التقطته المراجعة
     الذاتية الثانية؛ انحدارٌ من إصلاح تلاصق الزرّين). */
  .pcard a.btn{margin-top:var(--sp-2);margin-inline-end:var(--sp-2)}
  .btn:focus-visible{outline:2px solid var(--pri);outline-offset:2px;
    box-shadow:0 0 0 4px var(--pri-light)}
  .btn:hover{background:var(--pri-dark)}
  .btn.gh{background:#fff;color:var(--pri);border:1.5px solid var(--pri-line)}
  .btn.gh:hover{background:var(--pri-soft)}
  .btn.warn{background:#fff;color:var(--bad);border:1.5px solid var(--bad-line)}
  .btn.warn:hover{background:var(--bad-soft)}
  .btn.sm{padding:7px 12px;font-size:var(--fs-meta);border-radius:var(--r-sm)}
  .btn:disabled{opacity:.45;cursor:not-allowed}


  /* ═══ التخطيط: شريط جانبي ثابت + منطقة عمل ═════════════════════════════════
     بلاغ المالك: «التصميم سيّئ، المفروض فيه قائمة جانبية، بس النثر هذا» — وكان
     محقّاً: ستّة ألواح مرصوفة في تمرير رأسيّ واحد تُقرأ مستنداً لا أداة. الآن
     قائمةٌ جانبية تُبدِّل قسماً واحداً في المنطقة، فالشاشة تُظهِر ما تعمل عليه
     الآن لا كلَّ شيءٍ دفعةً واحدة. */
  .shell{display:flex;min-height:100vh}
  aside.side{width:var(--sidew);flex:0 0 var(--sidew);background:var(--side);
    color:var(--side-ink);position:fixed;inset-block:0;inset-inline-start:0;
    display:flex;flex-direction:column;z-index:30;overflow-y:auto;
    border-inline-end:1px solid var(--side-line)}
  aside.side .logo{padding:16px 18px 14px;border-bottom:1px solid var(--side-line);
    display:flex;align-items:baseline;gap:8px}
  aside.side .logo b{font-size:20px;
    font-weight:700;color:var(--ink);line-height:1.1}
  aside.side .logo span{font-size:var(--fs-meta);color:var(--gold-ink)}
  aside.side nav{padding:var(--sp-3) var(--sp-2);flex:1}
  /* عنوان المجموعة: صغيرٌ مكتوم عريض — يفصل «العمل» عن «الحساب» بلا خطٍّ
     زائد (sumi: عنوان 11–12px؛ رفعناه إلى 13px لأن العربية لا تملك
     uppercase تُكسِبها التمييز، والأرضية 13px أمرُ مالك). */
  aside.side .navgroup{font-size:var(--fs-group);font-weight:700;
    color:var(--muted);letter-spacing:.3px;padding:var(--sp-4) var(--sp-3) var(--sp-2)}
  aside.side .navgroup:first-child{padding-top:var(--sp-2)}
  aside.side .navgroup+button{margin-top:0}
  aside.side nav button{display:flex;width:100%;align-items:center;gap:10px;
    background:none;color:var(--side-ink);text-align:start;
    padding:var(--sp-2) var(--sp-3);min-height:42px;
    border-radius:var(--r-md);font-size:var(--fs-nav);font-weight:600;
    margin-bottom:2px;transition:background var(--dur-fast) ease}
  aside.side nav button .lbl{flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  aside.side nav button svg{flex:0 0 auto;opacity:.7}
  aside.side nav button:hover{background:var(--side-hover);color:var(--ink)}
  aside.side nav button:focus-visible{outline:2px solid var(--pri);
    outline-offset:-2px}
  /* الحالة النشطة: خلفية زرقاء ناعمة + شريط جانبي 3px — اللون وحده ليس
     دليلاً (sumi/accessibility: لا تعتمد اللون مؤشّراً وحيداً). */
  aside.side nav button.on{background:var(--pri-soft);color:var(--pri-active);
    box-shadow:inset 3px 0 0 var(--pri)}
  html[dir="ltr"] aside.side nav button.on{box-shadow:inset -3px 0 0 var(--pri)}
  aside.side nav button.on svg{opacity:1}
  aside.side nav button .n{margin-inline-start:auto;font-size:var(--fs-meta);
    font-weight:700;color:var(--muted);
    font-family:"IBM Plex Mono",monospace;font-feature-settings:"tnum"}
  aside.side nav button.on .n{color:var(--pri-active)}
  /* ذيل الهوية: حرفٌ أوّل + الاسم + اسم المنشأة. لا بريد — موضعه «الملف
     التعريفي» وحده (قرار المالك 2026-08-20). */
  aside.side .foot{padding:var(--sp-3);border-top:1px solid var(--side-line);
    font-size:var(--fs-meta);line-height:var(--lh-ui)}
  aside.side .foot .idrow{display:flex;align-items:center;gap:var(--sp-3);
    padding:var(--sp-2);border-radius:var(--r-md)}
  aside.side .foot .av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;
    background:var(--pri-soft);color:var(--pri-active);display:flex;
    align-items:center;justify-content:center;font-weight:700;
    font-size:var(--fs-table);border:1px solid var(--pri-line)}
  aside.side .foot .idtxt{min-width:0;flex:1}
  aside.side .foot .nm{display:block;color:var(--ink);font-weight:700;
    unicode-bidi:plaintext;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  aside.side .foot .sub{color:var(--muted);font-weight:500;display:block;
    unicode-bidi:plaintext;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main.work{flex:1;margin-inline-start:var(--sidew);min-width:0}
  .sect{display:none}
  .sect.on{display:block}
  /* شريط المقاييس **ليس قسماً**: يبقى ظاهراً في كل قسم كسياقٍ دائم (الرصيد
     والحصّة وحالة البريد لازمةٌ أينما كنت). وحين كان قسماً، كانت
     `.sect.on{display:block}` تطغى على `display:grid` فتراصفت البطاقات في
     عمودٍ واحد — التقطتها لقطةُ رُتبة ٣، والقاعدة الأخصّ تبقى حرزاً لو أُعيد. */
  .stats.sect.on{display:grid}
  /* الجوّال: القائمة تنطوي ويُظهِرها زرّ — لا تمريرٌ أفقيّ للصفحة أبداً. */
  #sideToggle{display:none}
  @media(max-width:820px){
    aside.side{transform:translateX(100%);transition:transform .18s ease}
    aside.side.open{transform:translateX(0)}
    main.work{margin-inline-start:0}
    #sideToggle{display:inline-flex}
    main.work .stats{grid-template-columns:1fr}
    header.top{top:0}
    /* على الجوّال: الأزرار تنزل سطراً تحت العنوان داخل الرأس نفسه بدل أن
       تُزاحمه، فيبقى العنوان والجرس مقروءَين. */
    header.top .toolbar{margin-inline-start:0;width:100%;order:3}
  }

  /* ── الدخول ── */
  .login{max-width:400px;margin:8vh auto 0;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow-md);padding:30px 26px}
  .login h1{font-size:26px;font-weight:700;
    color:var(--pri);line-height:1.3}
  .login p.sub{font-size:var(--fs-body);color:var(--muted);margin-bottom:16px}

  /* ── الشريط العلوي وشريط الأدوات ── */
  header.top{background:var(--panel);border-bottom:1px solid var(--line);
    padding:11px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;
    position:sticky;top:0;z-index:20}
  /* عنوان القسم = أعلى درجات السلّم، بالحبر لا بلون الفعل (اللون الأساسي
     للأفعال والروابط؛ عنوانٌ ملوّن يُقرأ رابطاً). كان 18px و`--fs-page`
     رمزاً ميتاً (فحص شامل 2026-08-20). */
  header.top b.brand{font-size:var(--fs-page);font-weight:700;
    color:var(--ink);line-height:1.25}
  header.top .tagline{font-size:var(--fs-meta);color:var(--ink-soft)}
  header.top .who{margin-inline-start:auto;font-size:var(--fs-meta);color:var(--ink-soft);
    display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  /* ── جرس الإشعارات (قرار 2026-08-18: تبليغ اكتمال الدراسة) ── */
  #notifBtn{position:relative}
  .nbadge{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--bad);
    color:#fff;font-size:var(--fs-meta);font-weight:700;border-radius:99px;
    padding:1px 7px;
    min-width:16px;text-align:center;line-height:1.4}
  .nmenu{position:absolute;top:calc(100% + 6px);inset-inline-end:14px;width:330px;
    max-width:calc(100vw - 28px);max-height:60vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow-sm);z-index:30}
  .nmenu .nrow{padding:10px 14px;border-bottom:1px solid var(--line-2);
    font-size:var(--fs-meta)}
  .nmenu .nrow b{display:block;font-weight:600}
  /* نقطةٌ قبل العنوان: التمييز كان باللون وحده — نفس القاعدة التي
     يحترمها شريط التنقّل النشط («اللون وحده ليس دليلاً»). */
  .nmenu .nrow.unread b{color:var(--pri)}
  .nmenu .nrow.unread b::before{content:"";display:inline-block;
    width:7px;height:7px;border-radius:50%;background:var(--pri);
    margin-inline-end:6px;vertical-align:middle}
  .sronly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .nmenu .nrow .nt{color:var(--muted);font-size:var(--fs-meta);margin-top:2px}
  .nmenu .nempty{padding:14px;color:var(--muted);font-size:var(--fs-meta)}
  .nmenu .nrow:last-child{border-bottom:none}
  /* ── بطاقات البروفايل (قرار 2026-08-18) ── */
  .pcards{padding:14px 16px;display:grid;gap:12px;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .pcard{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;
    display:flex;flex-direction:column;gap:9px;align-items:flex-start}
  .pcard>b{font-size:var(--fs-body);font-weight:700}
  .frow{display:flex;flex-direction:column;gap:3px;width:100%}
  .frow label{font-size:var(--fs-meta);color:var(--muted);font-weight:600}
  .frow input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;
    font:inherit;font-size:var(--fs-table);width:100%;background:var(--panel)}
  .frow input:disabled{background:var(--line-2);color:var(--muted)}
  /* ── عرض التقرير المقنع (قرار 2026-08-18: «مثل البيانات في اشكال بيانية») ── */
  .dlg.wide{max-width:780px}
  .rverdict{display:inline-flex;align-items:center;gap:7px;font-weight:700;
    font-size:var(--fs-table);border-radius:99px;padding:6px 14px;margin-bottom:10px}
  .rverdict.go,.rverdict.conditional,.rverdict.preliminary{
    background:var(--ok-soft);color:var(--ok)}
  .rverdict.watch,.rverdict.inconclusive{background:var(--warn-soft);color:var(--warn)}
  .rverdict.nogo{background:var(--bad-soft);color:var(--bad)}
  .rverdict.unknown{background:var(--line-2);color:var(--ink-soft)}
  /* الموجة Z: نبراتُ **حالةِ الأدلة** (الموجة B) لم يكن لها لونٌ هنا، فتخرج
     الشارةُ بلا خلفيةٍ إطلاقاً — نفسُ عائلة تباعُد الخريطتين في `Z-03`.
     محايدةٌ عمداً: ليست حكماً تجارياً فلا تأخذ أخضرَ ولا أحمر. */
  .rverdict.data_complete,.rverdict.data_partial,.rverdict.data_absent{
    background:var(--line-2);color:var(--ink-soft)}
  .rstats{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    margin:0 0 12px}
  .rstat{border:1px solid var(--line);border-radius:var(--r-md);padding:9px 12px}
  .rstat .k{font-size:var(--fs-meta);color:var(--muted);font-weight:600;display:block}
  .rstat .v{font-size:17px;font-weight:700}
  .rh{font-size:var(--fs-sect);font-weight:700;margin:12px 0 5px;color:var(--ink)}
  .rtext{line-height:var(--lh-text);font-size:var(--fs-body)}
  .rtext ul{padding-inline-start:18px;margin:4px 0}
  .rlimits{background:var(--warn-soft);border:1px solid #F5DFA6;
    border-radius:var(--r-md);padding:10px 13px;font-size:var(--fs-meta);margin-top:10px}
  .rlimits b{display:block;margin-bottom:3px}
  /* الشريط صار داخل الرأس (2026-08-19): بلا خلفية ولا حدٍّ ولا التصاقٍ
     مستقلّ — الرأس نفسه هو اللاصق، والأزرار تُدفَع إلى طرف النهاية قبل
     الجرس. `.spacer` القديمة كانت تباعد داخل صفٍّ مستقلّ فتُلغى هنا. */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-inline-start:auto}
  header.top .toolbar .btn{font-size:var(--fs-meta)}

  /* ── المقاييس ── */
  .stats{padding:var(--sp-5) var(--sp-6) var(--sp-1);display:grid;gap:var(--sp-3);
    grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}
  /* حدٌّ أعلى للبطاقة: بلا `auto-fill` كان الرقم الواحد يسكن علبةً بعرض
     380px على 1440px — كثافةٌ ضائعة وشكلُ قالبٍ إداريّ (فحص بصري
     2026-08-20). البطاقات تُرصَف من أول السطر وتبقى بحجمٍ واحد. */
  .stats>.stat{max-width:280px}
  .stats.quotabar>.stat{max-width:none}
  .stat{background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r-lg);box-shadow:var(--shadow-sm);
    padding:var(--sp-4) var(--sp-5)}
  .stat span.k{font-size:var(--fs-meta);color:var(--muted);font-weight:600;
    letter-spacing:.3px}
  .stat b.v{display:block;font-size:var(--fs-kpi);font-weight:700;
    margin-top:var(--sp-1);line-height:1.2;letter-spacing:-.01em;
    overflow-wrap:anywhere}
  /* القيمة الطويلة (رصيدٌ بفواصل) كانت تُقصّ من الحافّة — تنزل درجةً في
     السلّم فتُقرأ كاملة (فحص بصري 2026-08-20). */
  .stat b.v.long{font-size:var(--fs-sect);letter-spacing:0}
  /* سبع بطاقات على خمسة أعمدة تترك صفّاً يتيماً بعنصرين؛ أربعة أعمدة
     تعطي 4+3 — توزيعٌ مقصود لا بقايا. */
  #kpiGrid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  /* ستّ بطاقات (خرجت «خزنة المنصّة» مع سطح التمويل): ٣×٢ متساويان بدل
     ٤+٢ المتراصّ الذي يترك صفّاً نصفَ فارغ. */
  @media(min-width:1100px){#kpiGrid{grid-template-columns:repeat(3,1fr)}}
  .stat .v.bad,.pcard .frow b.bad{color:var(--bad)}
  /* صنفٌ مستقلّ: كان معرَّفاً متداخلاً فقط (`.stat .foot`) بينما يُستعمل
     وحده في خمسة مواضع — فتُرسَم تلك السطور بحجم الجسم ولون الحبر
     الكامل بدل بيانات وصفية مكتومة (فحص شامل 2026-08-20). */
  .foot{font-size:var(--fs-meta);color:var(--muted);margin-top:2px}
  .stat .foot{margin-top:2px}
  .meter{height:5px;background:var(--line-2);border-radius:99px;margin-top:8px;
    overflow:hidden}
  .meter i{display:block;height:100%;background:var(--pri);border-radius:99px}

  /* شريط المقاييس داخل لوح: البطاقات بيضاء على لوحٍ أبيض فتُقرأ إطاراتٍ
     عائمة. أرضيةٌ فاتحة تحته تجعلها بطاقاتٍ فعلاً وتفصل رأس اللوح عن جسمه
     (فحص بصري 2026-08-20). */
  .panel>.stats{background:var(--zebra);border-bottom:1px solid var(--line);
    padding-bottom:var(--sp-5)}

  /* شريط الحصّة (2026-08-20): كان بطاقةً تمتدّ بعرض الشاشة فتترك فراغاً
     هائلاً يميناً — «مساحة بيضاء بلا وظيفة» في بلاغ المالك. الآن صفٌّ واحد
     مضغوط: التسمية ثم الرقم ثم المقياس يملأ الباقي. */
  .stats.quotabar{grid-template-columns:1fr;padding-bottom:0}
  .quotabar .stat{display:flex;align-items:center;gap:var(--sp-4);
    padding:var(--sp-3) var(--sp-5);flex-wrap:wrap}
  .quotabar .stat span.k{margin:0;flex:0 0 auto}
  .quotabar .stat b.v{font-size:var(--fs-sect);margin:0;flex:0 0 auto}
  .quotabar .stat .meter{flex:1 1 160px;margin:0;min-width:120px}
  .quotabar .stat .foot{flex:0 0 auto;margin:0}
  /* عرض المحتوى محدود: على 1920px كانت البطاقات تتمطّط بلا داعٍ فيتباعد
     العنوان عن رقمه — الحدّ يجعل الكثافة ثابتة عبر الشاشات.
     **الهامش جزءٌ من الصيغة**: `margin-inline:auto` وحده يُصفّر الهامش
     الجانبي حين لا تفيض المساحة، فتلتصق الألواح بالحافّة على 1440px
     و1280px وعلى الجوّال كلّه (التقطته المراجعة الذاتية قبل الدمج).
     `min()` تُبقي 24px على كلّ جانبٍ دائماً ثمّ تُوسِّط ما زاد. */
  main.work>.stats,main.work>.panel,main.work>.msg{
    max-width:min(1360px,calc(100% - var(--sp-12)));
    margin-inline:auto}
  /* أعمدة المقاييس تُحاذي حافّة اللوح: الحشو الجانبي انتقل إلى الصيغة. */
  main.work>.stats{padding-inline:0}

  /* كتلةٌ داخل لوح: عنوان صغير ثم محتواه — بدل حشوٍ مبعثر في style مضمّن. */
  .blk{padding:var(--sp-5) var(--sp-5) 0}
  .blk+.tbl,.blk+.empty{margin-top:var(--sp-3)}
  .blk .blkh{display:block;font-size:var(--fs-meta);color:var(--muted);
    font-weight:700;margin-bottom:var(--sp-2)}
  .blk .blkh.lg{font-size:var(--fs-sect);color:var(--ink)}
  /* حالة فارغة بأيقونة وسبب وفعل (sumi/performance-states: توضيح + دعوة)،
     بارتفاعٍ محدود — كانت سطراً عائماً في فراغٍ مفتوح. */
  .estate{display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:var(--sp-2);text-align:center;
    padding:var(--sp-6) var(--sp-4);color:var(--muted);
    background:var(--zebra);border:1px dashed var(--line);
    border-radius:var(--r-lg)}
  .estate svg{opacity:.5}
  .estate b{color:var(--ink-soft);font-size:var(--fs-body);font-weight:700}
  .estate span{font-size:var(--fs-meta);max-width:44ch;line-height:var(--lh-text)}

  /* شريط توزيع الباقات: شرائح نسبية + وسيلة إيضاح. أربعة ألوان فئوية فقط
     (حدّ sumi ≤٨)، ثلاثةٌ من سلّم أزرق سِلك والرابع الذهبي — لونُ بيانات
     مسموح، وليس لون واجهة. الرقم بجانب كل اسم فلا يُقرأ اللونُ وحده. */
  .tbar{margin:0 var(--sp-4) var(--sp-5)}
  .tbar-track{display:flex;height:14px;border-radius:999px;overflow:hidden;
    background:var(--zebra);border:1px solid var(--line)}
  .tbar-track .seg{display:block;min-width:3px}
  .tbar-legend{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-5);
    margin-top:var(--sp-3);font-size:var(--fs-meta)}
  .tbar-legend .li{display:flex;align-items:center;gap:var(--sp-2)}
  .tbar-legend .li.zero{opacity:.55}
  .tbar-legend .li .seg{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .tbar-legend .li b{color:var(--ink);font-weight:600}
  .tbar-legend .li .num{color:var(--muted)}
  .seg.t-basic{background:var(--pri-light)}
  .seg.t-silver{background:#93B4F5}
  .seg.t-gold{background:var(--gold)}
  .seg.t-platinum{background:var(--pri-active)}

  /* شريط أدوات فوق الجدول: بحث يسار الشريط ورقاقات الحالة بجواره. */
  .ftoolbar{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;
    padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--line)}
  .ftoolbar input[type=search]{flex:1 1 240px;max-width:340px;min-width:180px;
    height:40px}
  .fchips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
  .fchips button{background:var(--panel);color:var(--ink-soft);
    border:1px solid var(--line);border-radius:99px;
    padding:7px var(--sp-4);font-size:var(--fs-meta);font-weight:600;
    transition:background var(--dur-fast) ease}
  .fchips button:hover{background:var(--pri-soft);color:var(--pri-active)}
  .fchips button.on{background:var(--pri);color:var(--on-pri);
    border-color:var(--pri)}
  .fchips button .c{margin-inline-start:6px;opacity:.75;
    font-family:"IBM Plex Mono",monospace;font-feature-settings:"tnum"}

  /* هيكل التحميل: أشكالٌ تحاكي المحتوى النهائي لا دوّامة (sumi:
     performance-states — «الأشكال النائبة تعكس تخطيط المحتوى القادم»
     فتُلغى قفزة التخطيط عند وصول البيانات). التلألؤ يتوقّف تلقائياً مع
     prefers-reduced-motion عبر القاعدة العامة أعلى الملف. */
  .sk{background:linear-gradient(90deg,var(--line-2) 25%,
      var(--zebra) 37%,var(--line-2) 63%);
    background-size:400% 100%;animation:skshine 1.4s ease infinite;
    border-radius:var(--r-sm);display:block}
  @keyframes skshine{0%{background-position:100% 50%}100%{background-position:0 50%}}
  .sk.line{height:12px;margin:6px 0}
  .sk.val{height:26px;width:56px;margin-top:var(--sp-2)}
  .sk.k{height:12px;width:96px}
  tr.skrow td{height:48px}

  /* ── الألواح والجداول ── */
  .panel{margin:var(--sp-4) var(--sp-6);background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden}
  .panel>h2{font-size:var(--fs-sect);font-weight:700;
    padding:var(--sp-4) var(--sp-5);background:var(--panel);
    border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
    align-items:center;gap:10px;flex-wrap:wrap}
  .tbl{width:100%;overflow-x:auto}
  /* اخترنا التمرير الأفقي **المرئيّ شريطُه** لا تحويل الصفوف إلى بطاقات:
     الجداول ستّة بترويسات مختلفة، فتحويلها بطاقاتٍ يعيد تصميمها كلّها بينما
     التمرير موجود أصلاً — كان ينقصه الدليل عليه فقط (عمود «الحالة» يختفي على
     390px بلا أي إشارة — فحص بصري 2026-08-19).
     وتدرّجُ الحافة (خدعة الخلفية المحلّية) جُرِّب فسقط: خلفيّاتُ الترويسة
     والصفوف المتناوبة تُرسَم فوق خلفية الحاوية فيظهر التدرّج شرائطَ مقطّعة
     على الصفوف الفردية وحدها — تلميحٌ أسوأ من غيابه. الشريط الدائم أصدق. */
  @media(max-width:820px){
    .tbl{overflow-x:scroll;scrollbar-width:thin;
      scrollbar-color:var(--line-2) transparent}
    .tbl::-webkit-scrollbar{height:8px}
    .tbl::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px}
    .tbl::-webkit-scrollbar-track{background:transparent}
  }
  /* الأرضية للجداول العريضة وحدها: كانت عامّةً فتفرض تمريراً أفقياً على
     جدول عمودين أيضاً وتُبطِل التفاف جداول النوافذ (فحص 2026-08-20). */
  table{width:100%;border-collapse:collapse;font-size:var(--fs-table)}
  #studiesPanel table,#productsPanel table,#accountsPanel table,
  #adminCostsPanel table{min-width:560px}
  #adminStudiesPanel table{min-width:900px}
  th{text-align:start;font-size:var(--fs-group);color:var(--muted);font-weight:700;
    padding:var(--sp-3) var(--sp-4);background:var(--zebra);
    border-bottom:1px solid var(--line);white-space:nowrap;
    letter-spacing:.2px}
  td{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--line-2);
    vertical-align:middle;height:48px}
  /* الصفوف المتناوبة حُذفت: تمييز الصفّ بالتحويم أوضح وأقلّ ضجيجاً بصرياً
     (sumi: Data-Ink — كل حبرٍ لا يحمل معلومة يُحذف). */
  tbody tr{transition:background var(--dur-fast) ease}
  tbody tr:hover td{background:var(--pri-soft)}
    tbody tr:last-child td{border-bottom:none}
  .empty{padding:var(--sp-10) var(--sp-4);text-align:center;color:var(--muted);font-size:var(--fs-body)}
  .pill{display:inline-block;font-size:var(--fs-meta);padding:4px 10px;
    border-radius:99px;
    font-weight:700;white-space:nowrap}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.bad{background:var(--bad-soft);color:var(--bad)}
  /* كان `--muted` على #EAECF0 = 3.96:1 (تحت 4.5:1) — الحبر الأغمق 8.7:1. */
  .pill.no{background:#EAECF0;color:var(--ink-soft)}
  .pill.pri{background:var(--pri-soft);color:var(--pri-dark)}
  .pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
  .prov{font-size:var(--fs-meta);color:var(--muted);padding:10px 16px;line-height:1.6;
    border-top:1px solid var(--line-2)}

  /* ── الرسائل ── */
  .msg{font-size:var(--fs-body);padding:var(--sp-3) var(--sp-4);
    border-radius:var(--r-md);margin:var(--sp-3) var(--sp-6);
    display:none;line-height:1.6}
  .msg.on{display:block}
  .msg.err{background:var(--bad-soft);color:var(--bad)}
  .msg.good{background:var(--ok-soft);color:var(--ok)}
  .msg.note{background:var(--pri-soft);color:var(--pri-dark)}
  .msg.warn{background:var(--warn-soft);color:var(--warn)}
  .login .msg{margin:0 0 8px}

  /* ── النوافذ · dialogs ── */
  .veil{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:40;
    display:flex;align-items:center;justify-content:center;padding:16px;
    overflow:hidden}
  .dlg{background:var(--panel);border-radius:var(--r-lg);width:100%;
    max-width:530px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);
    display:flex;flex-direction:column;min-width:0;overflow:hidden;
    box-shadow:0 20px 48px rgba(17,24,39,.24)}
  .dlg h3{font-size:var(--fs-sect);font-weight:700;padding:var(--sp-4) var(--sp-5);
    border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
    align-items:center;gap:12px;flex-shrink:0;overflow-wrap:anywhere}
  .dlg .bd{padding:16px 20px 20px;min-height:0;overflow:auto;
    overscroll-behavior:contain;overflow-wrap:anywhere}
  .dlg .ft{padding:12px 20px;display:flex;gap:8px;justify-content:flex-start;
    flex-shrink:0;flex-wrap:wrap;border-top:1px solid var(--line)}
  .dlg .two>*{min-width:0}
  .dlg .dialog-error{white-space:pre-line;margin-bottom:12px}
  body.dialog-open{overflow:hidden}
  @media(max-width:520px){
    .veil{padding:8px}
    .dlg{max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px)}
    .dlg .bd{padding:12px}
    .dlg h3{padding:12px;font-size:16px}
    .dlg .ft{padding:10px 12px}
  }
  /* جداول داخل النوافذ تلتفّ بدل أن تُقصّ من الحافة (جولة 2026-08-17: عمود
     الثقة في نافذة التقرير كان مبتوراً) — .tbl الصفحة يبقى كما هو. */
  .dlg .tbl th{white-space:normal}
  .dlg .tbl td{word-break:break-word}
  .dlg .x{background:none;color:var(--muted);font-size:19px;line-height:1;
    padding:0 4px}
  .hint{font-size:var(--fs-meta);color:var(--muted);margin-top:6px;line-height:1.6}
  .picklist{max-height:190px;overflow-y:auto;border:1px solid var(--line);
    border-radius:6px;padding:4px}
  .picklist label{display:flex;gap:8px;align-items:center;margin:0;padding:7px 8px;
    font-weight:500;color:var(--ink);font-size:var(--fs-table);border-radius:var(--r-sm);cursor:pointer}
  .picklist label:hover{background:var(--pri-soft)}
  .picklist input[type=checkbox],.picklist input[type=radio]{width:auto;margin:0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){.two{grid-template-columns:1fr}}
  /* سحب الجوال بالإنجليزية (dir=ltr): جهة الانزلاق تنقلب — كتلة **ثانية**
     عمداً كي تبقى الكتلة الأولى (المفحوصة بايتياً) كما هي حرفياً. */
  @media(max-width:820px){
    html[dir="ltr"] aside.side{transform:translateX(-100%)}
    html[dir="ltr"] aside.side.open{transform:translateX(0)}
  }

  /* Approved Silk interfaces — shared shell, study folders and admin workspace. */
  body{background:linear-gradient(135deg,#f4f8ff,#fff 60%)}
  aside.side .logo{align-items:center;flex-direction:column;gap:0;padding:20px 24px;border-bottom:0}
  .silk-logo{width:108px;height:62px;object-fit:contain;display:block}
  aside.side .logo span{color:var(--muted)}
  aside.side nav{padding-inline:16px}
  aside.side nav button{border-radius:10px;margin-block:4px;padding-block:12px}
  aside.side nav button.on{background:var(--pri-soft);box-shadow:none}
  header.top{min-height:86px;background:rgba(255,255,255,.96);padding:20px 28px}
  header.top b.brand{font-size:23px}
  #factoryBar,#adminBar{margin-inline-start:auto}
  .btn{border-radius:999px;transition:background var(--dur-fast),box-shadow var(--dur-fast)}
  .btn.sm{border-radius:8px}
  #newStudyBtn{background:var(--ink);color:white;border-radius:999px;padding-inline:22px}
  #newStudyBtn:hover{background:var(--ink-soft)}
  .panel{border-radius:18px;box-shadow:0 6px 28px rgba(17,24,39,.025)}
  .stats>.stat{max-width:none;border-radius:14px}
  #factoryStats .stat{background:transparent;border:0;padding-inline:0}
  #studiesPanel{background:transparent;border:0;box-shadow:none}
  #studiesPanel .ftoolbar{padding:12px 0 24px;align-items:center}
  #studySearch{max-width:360px;border-radius:10px;background:white}
  .study-workspace{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px;align-items:start}
  .study-folders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 18px;padding:14px 0}
  .study-folder{position:relative;min-width:0;min-height:204px;text-align:start;color:var(--ink);background:linear-gradient(145deg,#f4f5f7,#e9ebef);border:1px solid #e5e7eb;border-radius:18px;padding:80px 18px 20px;isolation:isolate;transition:transform var(--dur-fast),box-shadow var(--dur-fast)}
  .study-folder::before{content:"";position:absolute;z-index:-1;inset:16px 16px 52%;background:white;border-radius:9px;box-shadow:0 -6px 0 -2px #e0e4eb;transform:rotate(-3deg)}
  .study-folder::after{content:"";position:absolute;z-index:-1;inset:62px 0 0;background:linear-gradient(160deg,rgba(255,255,255,.94),#e9ebef);border-radius:8px 8px 18px 18px;border-top:1px solid white}
  .study-folder:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(17,24,39,.08)}
  .study-folder[aria-pressed="true"]{background:#8bb8ff;border-color:var(--pri);box-shadow:0 8px 22px rgba(37,99,235,.12)}
  .study-folder[aria-pressed="true"]::after{background:linear-gradient(155deg,#b7d4ff,#78aafa)}
  .study-folder strong{display:block;font-size:15px;overflow-wrap:anywhere;margin-bottom:4px}
  .study-folder .folder-market{display:block;color:var(--ink-soft);font-size:13px;margin-bottom:14px}
  .study-folder .pill{font-size:13px;background:rgba(255,255,255,.8);color:var(--ink);border:0}
  .study-inspector{background:white;border:1px solid var(--line-2);border-radius:16px;padding:22px;position:sticky;top:106px;min-width:0}
  .study-inspector h3{font-size:18px;margin-bottom:20px;overflow-wrap:anywhere}
  .study-inspector dl{display:grid;grid-template-columns:1fr;gap:4px;margin-bottom:20px}
  .study-inspector dt{font-size:13px;color:var(--muted);margin-top:12px}
  .study-inspector dd{font-size:14px;overflow-wrap:anywhere;margin:0}
  .study-inspector .inspector-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--line-2)}
  .study-inspector .foot{font-size:13px;margin-block:12px}
  .study-view-tools{display:flex;justify-content:flex-end;margin-bottom:8px}
  #studyViewBtn{font-size:13px}

/* استخلاص رسالة الخطأ من `detail` — قد يكون نصّاً أو كائناً (بوّابات الطبقة
   والمال تُرجع كائناً بكود ورسالة). عرضُ «[object Object]» كان سيُخفي السبب. */
function detailText(d) {
  if (d == null) return "";
  if (typeof d === "string") return d;
  if (Array.isArray(d)) return d.map(detailText).join(" · ");
  if (typeof d === "object") {
    const bits = [];
    // السبب الأخصّ (`reason`) يسبق الكود العام: «نفدت حصّتك الشخصية» أوضح
    // من «نفدت الحصّة» حين يكون المنع على مستوى المستخدم لا الحساب.
    if (d.reason && (ERR_AR[d.reason] || ERR_EN[d.reason]))
      bits.push(dd(ERR_AR, ERR_EN, d.reason));
    else if (d.error && (ERR_AR[d.error] || ERR_EN[d.error]))
      bits.push(dd(ERR_AR, ERR_EN, d.error));
    else if (d.message) bits.push(d.message);
    else if (d.error) bits.push(d.error);
    if (d.user_limit != null && d.user_used != null)
      bits.push(ar_en(`(حصّتك: ${d.user_used}/${d.user_limit})`,
                      `(your quota: ${d.user_used}/${d.user_limit})`));
    else if (d.limit != null && d.used != null) bits.push(`(${d.used}/${d.limit})`);
    if (d.upgrade) bits.push(ar_en("— يحتاج ترقية الطبقة",
                                "— needs a tier upgrade"));
    return bits.join(" ") || JSON.stringify(d);
  }
  return String(d);
}

/* حارسُ عدم التكرار لخروجٍ واحد — نداءان متزامنان يعودان 401 معاً. */
let _loggingOut = false;

async function api(path, opts) {
  const o = Object.assign({headers: {}}, opts || {});
  o.headers["Content-Type"] = "application/json";
  if (TOKEN) o.headers["Authorization"] = "Bearer " + TOKEN;
  let r;
  try {
    r = await fetch(API + path, o);
  } catch (e) {
    /* R6 (FE-14): فشلُ الشبكة كان يصل «TypeError: Failed to fetch» خاماً. */
    if (e instanceof TypeError) {
      const ne = new Error(ar_en("تعذّر الاتصال بالخادم — تحقّق من الشبكة ثم أعد المحاولة.",
                                 "Could not reach the server — check your connection and retry."));
      ne.status = 0;
      ne.network = true;
      throw ne;
    }
    throw e;
  }
  let body = null;
  try { body = await r.json(); } catch (_e) { /* ردٌّ بلا JSON */ }
  if (!r.ok) {
    /* R3 (FE-3): جلسةٌ منتهية تُنهي الجلسة **أينما** وقعت — كان الحارس في
       `loadAll` وحدها، فاستطلاعُ الدراسات ونوافذُ الحوار تبتلع 401 صامتةً
       وتبقى الشاشة كأنّ المستخدم داخل (ثم يفشل كل فعلٍ بلا سبب مفهوم).
       نداءُ الخروج نفسه مستثنى فلا ارتداد لا نهائي. */
    if (r.status === 401 && TOKEN && path !== "/auth/logout" && !_loggingOut) {
      _loggingOut = true;
      try { await doLogout(); } finally { _loggingOut = false; }
    }
    const e = new Error(detailText(body && body.detail) || ("HTTP " + r.status));
    e.status = r.status;
    e.detail = body && body.detail;
    throw e;
  }
  return body;
}

function say(el, text, kind) {
  // مؤقت الرسالة السابقة لا يملك الجديدة (حتى رسالة الخطأ الدائمة).
  // Each message owns its expiry; cancel the previous message's timer.
  clearTimeout(el._messageTimer);
  el._messageTimer = null;
  el.textContent = text;
  el.className = "msg on " + (kind || "");
  if (kind === "good") el._messageTimer = setTimeout(() => {
    el.className = "msg";
    el._messageTimer = null;
  }, 7000);
  el.scrollIntoView({block: "nearest"});
}
const tell = (t, k) => say($("appMsg"), t, k);

function dialog(title, bodyHtml, onSubmit, submitLabel, reload) {
  const veil = document.createElement("div");
  veil.className = "veil";
  veil.innerHTML =
    '<div class="dlg" role="dialog" aria-modal="true"><h3><span></span>' +
    '<button class="x" aria-label="إغلاق">✕</button></h3>' +
    '<div class="bd"></div><div class="ft">' +
    '<button class="btn go"></button>' +
    '<button class="btn gh cancel"></button></div></div>';
  /* اسمٌ معلَن للنافذة: كانت `role="dialog"` بلا `aria-labelledby` فتُعلَن
     «حوار» بلا عنوان (فحص 2026-08-20). المعرّف فريد لتعدّد النوافذ. */
  _dlgSeq += 1;
  const _titleId = "dlgTitle" + _dlgSeq;
  const _titleEl = veil.querySelector("h3 span");
  _titleEl.id = _titleId;
  veil.querySelector(".dlg").setAttribute("aria-labelledby", _titleId);
  _titleEl.textContent = title;
  veil.querySelector(".cancel").textContent = ar_en("إلغاء", "Cancel");
  veil.querySelector(".bd").innerHTML = bodyHtml;
  veil.querySelector(".bd").insertAdjacentHTML("afterbegin",
    '<div class="msg err dialog-error" role="alert" tabindex="-1" hidden></div>');
  veil.querySelector(".btn.go").textContent = submitLabel || ar_en("حفظ", "Save");
  /* التركيز يعود إلى الزرّ الذي فتح النافذة عند الإغلاق — كان يسقط إلى
     أول الصفحة فيضيع موضع مستخدم لوحة المفاتيح. */
  const opener = document.activeElement;
  const close = () => {
    veil.remove();
    if (!document.querySelector("#dlgHost .veil")) document.body.classList.remove("dialog-open");
    if (opener && document.contains(opener) && opener.focus) opener.focus();
  };
  /* يُعلَّق على العنصر كي يستدعيه مستمع Escape العام بدل `remove()` الخام —
     وإلا لم تعمل إعادة التركيز على أشيع طريقة إغلاق (مراجعة ذاتية ثانية). */
  veil._close = close;
  veil.querySelector(".x").onclick = close;
  veil.querySelector(".cancel").onclick = close;
  veil.addEventListener("click", (ev) => { if (ev.target === veil) close(); });
  const go = veil.querySelector(".btn.go");
  go.onclick = async () => {
    go.disabled = true;
    // `reload === false` لنوافذ ما قبل الدخول (نسيت كلمة المرور): لا جلسة بعدُ
    // فاستدعاء loadAll كان يرتدّ 401 ويعيد المستخدم لشاشة الدخول برسالة خطأ.
    try {
      await onSubmit(veil); close();
      /* R6 (FE-20): تعديلُ/حذفُ دراسةٍ يعيد جدولَها وحده — لا إعادةَ بناءِ اللوحة كلّها. */
      if (reload === "studies") await loadStudies();
      else if (reload !== false) await loadAll();
    }
    catch (e) { showActionError(go, e.message || ar_en("تعذّر التنفيذ", "Action failed")); go.disabled = false; }
  };
  /* حبسُ التركيز داخل النافذة: بلا هذا يخرج Tab إلى الصفحة خلفها بينما
     الحجاب يغطّيها — تنقّلٌ في محتوى لا يراه المستخدم (WCAG 2.4.3). */
  veil.addEventListener("keydown", (ev) => {
    if (ev.key !== "Tab") return;
    const f = Array.from(veil.querySelectorAll(
      'button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])'))
      .filter((el) => !el.disabled && el.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (ev.shiftKey && document.activeElement === first) {
      ev.preventDefault(); last.focus();
    } else if (!ev.shiftKey && document.activeElement === last) {
      ev.preventDefault(); first.focus();
    }
  });
  $("dlgHost").appendChild(veil);
  document.body.classList.add("dialog-open");
  const first = veil.querySelector("input,select,textarea");
  if (first) first.focus();
  else { const b = veil.querySelector(".btn.go"); if (b) b.focus(); }
  return veil;
}

function showActionError(origin, message) {
  const veil = origin.closest(".veil");
  const box = veil && veil.querySelector(".dialog-error");
  if (!box || !document.contains(box)) { tell(message, "err"); return; }
  box.textContent = message;
  box.hidden = false;
  box.classList.add("on");
  box.focus();
  box.scrollIntoView({block: "nearest"});
}

    ar_en("هذه جهات محتملة للتواصل. وجودها في الخرائط لا يؤكد أنها تستورد المنتج أو ترغب في شرائه.",
      "These are potential contacts. A Maps listing does not confirm that they import this product or intend to buy it.") + '</p></section>';
}

function pdfBtn(id) {
  /* طلب المالك (2026-08-17): «بالنسبة للتقرير اريده pdf» — المُسلَّم النهائي
     PDF غير قابل للتحرير (نقطة docx تبقى خادمياً بلا زر). */
  const b = mkBtn(ar_en("تنزيل التقرير (PDF)", "Download report (PDF)"), "gh");
  /* صيد الفجوات ٣ (بلاغ حجب #12): كان `window.open` مباشراً — حجبُ بوابة
     الجودة (409) يفتح تبويباً بحمولة JSON خام يقرؤها المصنع حرفياً، ورسالةُ
     `factory_message` المصاغة بعناية لا تصل أحداً. الجلب يفحص الحالة ويعرض
     الرسالة عبر tell()، والنجاح ينزّل blob. */
  b.onclick = async () => {
    b.disabled = true;
    try {
      const r = await fetch(API + "/studies/" + id + "/report.pdf",
        TOKEN ? {headers: {Authorization: "Bearer " + TOKEN}} : undefined);
      if (!r.ok) {
        let body = null;
        try { body = await r.json(); } catch (_e) { /* ردٌّ بلا JSON */ }
        const det = body && body.detail;
        let msg = detailText(det) || ("HTTP " + r.status);
        /* شرط المُشرِف F: الأسماء لا العدد — حجبٌ بعدد فحوصه فقط غير قابل
           للتصرف؛ القائد (fail_drivers) يُسمّى أولاً. */
        /* نفسُ قاعدة سطح القراءة: جملةُ الزائر أوّلاً، والمعرّفُ احتياطٌ
           لا يظهر إلا إن غابت (بلاغ المالك الثالث). */
        const _dv2 = (det && det.fail_driver_reasons) || [];
        const _dr = (det && det.blocked_reasons) || [];
        if (_dv2.length) msg += " — " + _dv2[0];
        else if (_dr.length) msg += " — " + _dr.join(" ");
        /* مرجعُ الدعم في ذيل الرسالة — لا يتصدّرها (بلاغ المالك الثالث). */
        if (det && det.fail_drivers && det.fail_drivers.length)
          msg += " [" + ar_en("للدعم: ", "support: ") +
                 det.fail_drivers.join("، ") + "]";
        else if (det && det.blocked_checks && det.blocked_checks.length)
          msg += " [" + ar_en("للدعم: ", "support: ") +
                 det.blocked_checks.join("، ") + "]";
        showActionError(b, msg);
        return;
      }
      const blob = await r.blob();
      const u = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = u; a.download = "silk_report_" + id + ".pdf";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 4000);
    } catch (e) {
      showActionError(b, ar_en("تعذّر تنزيل التقرير: ", "Could not download the report: ") +
           e.message);
    } finally { b.disabled = false; }
  };
  return b;
}

/* رسالةُ ما بعد الإطلاق — مصدرٌ واحد لزرّ «إطلاق» ولزرّ «أقرّ بالتنبيه وأطلق». */
function _afterLaunch(s, out) {
  askNotifyPermission();   // لحظة الاهتمام الفعلي بالتبليغ عند الاكتمال
  const eta = out.eta_s
    ? ar_en(" المدة المتوقعة ~", " expected duration ~") + _fmtDur(out.eta_s) +
      (out.eta_basis === "declared_default"
        ? ar_en(" (تقديري)", " (estimate)") : "")
    : "";
  /* R2: الفتحات ممتلئة ⇒ الدراسة محجوزة في الطابور — لا نقول «انطلقت». */
  const head = out.run_state === "queued"
    ? ar_en("أُدرجت دراسة #", "Study queued #") + s.id +
      ar_en(" في الانتظار — تبدأ حين تفرغ فتحة تنفيذ",
            " — it starts when an execution slot frees")
    : ar_en("انطلقت دراسة #", "Study launched #") + s.id;
  tell(head + ar_en(" — الحصّة: ", " — quota: ") + out.quota_used + "/" +
       out.quota_limit + "." + eta, "good");
}

/* R4.8: تنبيهُ ما قبل التشغيل (`prerun_advisory`) — تصديرٌ إلى بلد المنشأ /
   سوقٌ تحت عقوبات / فصلٌ مقيَّد قانونياً. نصُّ الخادم يُعرَض حرفياً، والإقرارُ
   فعلُ المصنع: `PATCH advisories_ack` يختمه بوقته على الدراسة ثم يُعاد الإطلاق
   نفسُه. لا إقرارَ آليّاً نيابةً عنه. */
function ackLaunchBtn(s) {
  const b = mkBtn(ar_en("أقرّ بالتنبيه وأطلق", "Acknowledge and launch"), "go");
  b.onclick = () => advisoryDialog(s, {message: s.run_error || "", advisories: []});
  return b;
}

function advisoryDialog(s, detail) {
  const items = ((detail && detail.advisories) || []).map((a) =>
    "<li>" + esc(a.message || a.kind || "") +
    (a.detail ? ' <span class="hint">' + esc(a.detail) + "</span>" : "") +
    "</li>").join("");
  dialog(ar_en("تنبيه قبل التشغيل — دراسة #", "Pre-run advisory — study #") + s.id,
    "<ul>" + (items || "<li>" + esc((detail && detail.message) || "") + "</li>") +
      "</ul>" +
    '<p class="hint">' + ar_en(
      "لا تُطلَق إلا بإقرارك الصريح بهذا التنبيه — يُسجَّل باسمك ووقته على الدراسة.",
      "It launches only on your explicit acknowledgement — recorded on the study under your name and time.") +
      "</p>",
    async () => {
      /* ختمٌ قائم لا يُعاد (الخادم لا يقيّده مرّتين أيضاً) — نقرةٌ ثانية بعد
         فشل الإطلاق تعيد الإطلاقَ وحده. */
      if (!s.advisories_ack_at) {
        await api("/studies/" + s.id, {method: "PATCH",
                                       body: JSON.stringify({advisories_ack: true})});
        s.advisories_ack_at = "now";
      }
      const out = await api("/studies/" + s.id + "/launch", {method: "POST"});
      _afterLaunch(s, out);
    }, ar_en("أقرّ بالتنبيه وأطلق", "Acknowledge and launch"));
}

/* تهريبٌ للنصّ داخل HTML النافذة — العناوين والبُرد بيانات مستخدم. */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}

/* (حُذفت واجهات المستخدمين والدفتر — قرار 2026-08-18: مستخدم واحد فعلياً،
   والدفتر سجلُّ تمويلٍ أدمِني بعد «الباقة فقط». المسارات الخادمية باقية.) */

/* ═══ رفع صورة المنتج — داخل نافذة الدراسة حصراً (قرار المالك 2026-08-17:
   «ايش فائدة الصور في داشبورد المستخدم احذفها») — لا قسم صور مستقل. ═══ */
function _fmtBytes(n) {
  n = Number(n || 0);
  if (n >= 1048576) return (n / 1048576).toFixed(1) + " م.ب";
  if (n >= 1024) return (n / 1024).toFixed(0) + " ك.ب";
  return n + " بايت";
}

async function uploadImage(file) {
  /* رفعٌ بـFormData لا JSON — `api()` يفرض ترويسة JSON فلا يصلح للملفات. */
  const fd = new FormData();
  fd.append("file", file);
  const headers = {};
  if (TOKEN) headers["Authorization"] = "Bearer " + TOKEN;
  const r = await fetch(API + "/images", {method: "POST", body: fd, headers});
  let bodyJ = null;
  try { bodyJ = await r.json(); } catch (_e) { /* ردٌّ بلا JSON */ }
  if (!r.ok)
    throw new Error(detailText(bodyJ && bodyJ.detail) || ("HTTP " + r.status));
  return bodyJ;
}

           : ar_en(" (افتراض الباقة)", " (tier default)"))

    pill(tr, a.is_active ? ar_en("نشط", "Active") : ar_en("معطَّل", "Disabled"),

    rn.onclick = () => dialog(
      ar_en("إعادة تسمية الحساب", "Rename account"),

   بـcreateElementNS — لا مكتبة خارجية (CSP صارمة، اتفاق البيت). */
/* ═══ الباقات (أدمِن) ═══════════════════════════════════════════════════ */
/* الجدول يدمج مصدرين قائمين بلا نقطةٍ جديدة: `GET /platform/pricing` (السعر
   والحصّة الفعّالان + تصريحُ المصدر) و`accounts_by_tier` من مقاييس الأدمِن
   (عدد المشتركين — يستثني الخزنة خادمياً). */
async function loadTiers() {
  const pr = await api("/pricing");
  CACHE.pricing = pr;
  renderTiers();
}

function renderTiers() {
  const body = $("tiersBody");
  body.textContent = "";
  const rows = (CACHE.pricing && CACHE.pricing.tiers) || [];
  emptyToggle("tiersEmpty", rows.length);
  if (!rows.length) {
    $("tiersEmpty").textContent = "";
    emptyState($("tiersEmpty"), "M4 7h16M4 12h16M4 17h10",
      ar_en("تعذّر جلب الباقات.", "Could not load the plans."),
      ar_en("اضغط «تحديث» — لا نعرض أسعاراً من ذاكرة الصفحة.",
         "Press “Refresh” — we do not show prices from page memory."));
    return;
  }
  /* عدد المشتركين: غياب المقاييس ≠ صفر. المقاييس المجلوبة تعطي صفراً
     **مرصوداً** لباقةٍ بلا حسابات (العدّ أعاد لا-شيء)، وغيابُها يعطي «—». */
  const metrics = CACHE.metrics;
  const byTier = (metrics && metrics.accounts_by_tier) || null;
  const cur = (CACHE.pricing && CACHE.pricing.currency) || "";
  rows.forEach((t) => {
    const tr = document.createElement("tr");
    pill(tr, dd(TIER_AR, TIER_EN, t.key), "gold");
    /* أرقام لاتينية دائماً بصنف `.num` — اتفاق كل رقم في اللوحة (IBM Plex
       Mono + tabular-nums + عزل ltr). و«مجاناً» نصٌّ لا رقم فيخرج من الصنف:
       `.num` يفرض خطّاً لاتينياً واتجاهاً ltr فيكسر تشكيل العربية. */
    const money = (tr_, v) => {
      const n = Number(v);
      if (n > 0) cell(tr_, n.toLocaleString("en-US") + " " + cur, "num");
      else cell(tr_, ar_en("مجاناً", "Free"));
    };
    money(tr, t.price);
    money(tr, t.price_annual);
    /* الأساسية محكومةٌ بسقف مدى الحياة لا بالشهري (`quota.py` تتفرّع عليها
       قبل السطر الشهري) — فعرضُ رقمٍ شهريّ لها إيهامٌ بحدٍّ لا يقرؤه أحد. */
    cell(tr, t.key === "basic"
      ? ar_en("سقف مدى الحياة", "Lifetime cap")
      : String(t.monthly_studies), t.key === "basic" ? "" : "num");
    cell(tr, byTier ? String(Number(byTier[t.key] || 0)) : "—", "num");
    pill(tr, t.overridden ? ar_en("معدَّل", "Edited") : ar_en("الملف", "File"),
         t.overridden ? "pri" : "no");
    const td = document.createElement("td");
    const b = mkBtn(ar_en("تعديل", "Edit"), "gh", "plan");
    b.onclick = () => tierSettingsDialog(t);
    td.appendChild(b);
    tr.appendChild(td);
    body.appendChild(tr);
  });
}

   (`flex-grow`) لا برسم SVG: الطول ترميزٌ أدقّ من المساحة أو اللون
   (sumi/data-visualization: موضع > طول > مساحة > لون)، والتخطيط يتكيّف مع
   العرض بلا قياسٍ يدويّ ولا نسبة أبعاد. الذهبي هنا لونُ **بيانات** لا واجهة.

    val.textContent = r.n + " · " + Math.round((r.n / total) * 100) + "%";
    item.appendChild(val);

function _kpi(label, value, foot) {

  v.textContent = value;
  d.appendChild(k); d.appendChild(v);
  if (foot) { const f = document.createElement("div"); f.className = "foot";
    f.textContent = foot; d.appendChild(f); }

}

const _SVG_NS = "http://www.w3.org/2000/svg";
function _svgEl(name, attrs) {
  const el = document.createElementNS(_SVG_NS, name);
  Object.entries(attrs || {}).forEach(([k, v]) => el.setAttribute(k, String(v)));
  return el;
}

function renderStudiesChart(series) {
  const host = $("studiesChart");
  host.textContent = "";
  $("chartLegend").textContent = ar_en("أُطلقت (أزرق) · اكتملت (ذهبي)",
    "Launched (blue) · Completed (gold)");
  const rows = Array.isArray(series) ? series : [];
  const maxV = Math.max(1, ...rows.map((r) =>
    Math.max(Number(r.launched || 0), Number(r.completed || 0))));
  if (!rows.length || !rows.some((r) => r.launched || r.completed)) {
    /* الحالة الموحّدة (أيقونة + ماذا حدث + ماذا تفعل) — كانت سطراً عائماً.
       يبقى صنف `empty` على العنصر نفسه: تدفّق رُتبة ٣ يعدّه عقداً. */
    emptyState(host, "M3 3v18h18M7 16l3.5-4 3 2.5L18 9",
      ar_en("لا بيانات كافية لرسم الشهور بعد.",
            "Not enough data to chart months yet."),
      ar_en("يمتلئ الرسم تلقائياً مع أول إطلاقات الدراسات.",
            "The chart fills automatically with the first study launches."))
      .classList.add("empty");
    return;
  }
  /* كان `W = 560` ثابتاً مع `width:"100%"` بلا ارتفاعٍ ولا نسبة أبعاد: الرسم
     كلّه يتمدّد بمقياس الحاوية، فتُرسَم تسمياتُ الشهور بنحو 21px على 1920px
     و5px على 390px — نفس العلّة التي أُصلحت في مخطّط المصنع وبقيت هنا لأن
     حارسها يشرّح `renderMarketsChart` وحدها (فحص شامل 2026-08-20). */
  const W = Math.max(320, Math.min(720, Math.round(host.clientWidth || 560)));
  const H = 170, padX = 34, padB = 24, padT = 8;
  const svg = _svgEl("svg", {viewBox: `0 0 ${W} ${H}`,
                             width: String(W), height: String(H),
                             preserveAspectRatio: "xMinYMin meet",
                             role: "img",
                             "aria-label": ar_en("الدراسات عبر الشهور",
                                                 "Studies by month")});
  svg.style.maxWidth = "100%";
  svg.style.height = "auto";
  const plotH = H - padB - padT, plotW = W - padX * 2;
  const ticks = Math.min(4, maxV);
  for (let t = 0; t <= ticks; t++) {
    const val = Math.round((maxV * t) / ticks);
    const y = H - padB - (plotH * t) / ticks;
    svg.appendChild(_svgEl("line", {x1: padX, x2: W - padX, y1: y, y2: y,
      stroke: "#EEF2F7", "stroke-width": 1}));
    const lbl = _svgEl("text", {x: padX - 6, y: y + 4, "text-anchor": "end",
      direction: "ltr", "font-size": "11.5", fill: "#64748B",
      "font-family": "IBM Plex Mono,monospace"});
    lbl.textContent = String(val);
    svg.appendChild(lbl);
  }
  const group = plotW / rows.length;
  const barW = Math.min(14, group / 3);
  rows.forEach((r, i) => {
    const cx = padX + group * i + group / 2;
    // زوج فئوي واحد ثابت الترتيب (dataviz): أزرق الداشبورد × ذهبي سِلك —
    // صبغتان متباعدتان تصمدان لعمى الألوان، والنص بألوان الحبر لا السلسلة.
    const pairs = [["launched", "#2563EB", ar_en("أُطلقت", "Launched")],
                   ["completed", "#C9A227", ar_en("اكتملت", "Completed")]];
    pairs.forEach(([key, color, label], j) => {
      const v = Number(r[key] || 0);
      const h = (plotH * v) / maxV;
      const rect = _svgEl("rect", {
        x: cx - barW + j * barW + (j ? 1 : -1), y: H - padB - h,
        width: barW, height: Math.max(h, v ? 2 : 0), fill: color, rx: 2});
      const tip = _svgEl("title", {});
      tip.textContent = `${r.month} — ${label}: ${v}`;
      rect.appendChild(tip);
      svg.appendChild(rect);
    });
    /* تسميةُ كلّ شهرٍ تُسقَط تناوباً حين تضيق الخانة بدل تصغير الخطّ تحت
       الاستثناء المعلَن — القيمة الكاملة في التلميح على أي حال. */
    const everyOther = group < 34 && rows.length > 6;
    if (!everyOther || i % 2 === 0) {
      const ml = _svgEl("text", {x: cx, y: H - 8, "text-anchor": "middle",
        direction: "ltr", "font-size": "11.5", fill: "#64748B",
        "font-family": "IBM Plex Mono,monospace"});
      ml.textContent = String(r.month || "").slice(2);   // YY-MM
      svg.appendChild(ml);
    }
  });
  host.appendChild(svg);
}

/* فحص المصادر الحية بنقرة — يعرض ردّ /admin/diagnostics (منقّح الأسرار
   خادمياً، مقيّد المعدل). حالات المصادر كما يعلنها المحرّك — لا تجميل. */
const _DIAG_AR = {ok: "يعمل", reachable_empty: "متصل بلا نتائج",
                  no_key: "بلا مفتاح", unreachable: "محجوب/لا يصل"};
const _DIAG_EN = {ok: "Working", reachable_empty: "Reachable, empty",
                  no_key: "No key", unreachable: "Blocked/unreachable"};
const _DIAG_PILL = {ok: "ok", reachable_empty: "warn",
                    no_key: "no", unreachable: "bad"};
async function runDiagnostics(btn) {
  btn.disabled = true;
  btn.textContent = ar_en("جارٍ الفحص…", "Checking…");
  try {
    const out = await api("/admin/diagnostics", {method: "POST"});   /* R7 (AUTH-8) */
    const body = $("diagBody");
    body.textContent = "";
    (out.sources || []).forEach((s) => {
      const tr = document.createElement("tr");
      cell(tr, s.name || "—");
      pill(tr, dd(_DIAG_AR, _DIAG_EN, s.state), _DIAG_PILL[s.state] || "no");
      cell(tr, (s.detail || "—") +
           (s.ms != null ? " (" + s.ms + ar_en("مث", "ms") + ")" : ""));
      cell(tr, s.hint || "—");
      body.appendChild(tr);
    });
    $("diagWrap").classList.remove("hide");
    tell(out.agents_can_work
      ? ar_en("الأساس (كومتريد + البنك الدولي) يعمل — الدراسات ستحمل بيانات.",
           "The base (Comtrade + World Bank) works — studies will carry data.")
      : ar_en("الأساس لا يعمل الآن — راجع جدول المصادر والعلاج المقترح.",
           "The base is not working now — see the sources table and fixes."),
      out.agents_can_work ? "good" : "err");
  } catch (e) { tell(ar_en("تعذّر الفحص: ", "Check failed: ") + e.message, "err"); }
  btn.disabled = false;
  btn.textContent = ar_en("فحص المصادر الآن", "Check sources now");
}

/* إشراف الأدمِن على كل دراسات المصانع — قرار المالك: «من واجهة الأدمن يكون
   مطلعاً على الدراسات». بيانات الطلب التشغيلية فقط (لا بريد ولا محتوى). */
/* وضعُ التشغيلة بلغةٍ مفهومة — لا رموز خام في عمودٍ يقرؤه المالك. */
const MODE_AR = {deep: "عميق", quick: "سريع", fake: "محاكاة"};
const MODE_EN = {deep: "Deep", quick: "Quick", fake: "Simulated"};

function renderAdminStudies(rows) {
  const body = $("adminStudiesBody");
  body.textContent = "";
  emptyToggle("adminStudiesEmpty", rows.length);
  /* R6 (FE-9): بلوغُ الحدّ يُقال — وزرٌّ يوسّعه إلى ٥٠٠ لا أكثر (سقفُ الخادم). */
  const note = $("adminStudiesNote");
  if (note) {
    note.textContent = "";
    note.classList.toggle("hide", rows.length < ADMIN_LIMIT);
    if (rows.length >= ADMIN_LIMIT) {
      note.textContent = ar_en("تُعرَض أحدث " + ADMIN_LIMIT + " دراسة فقط. ",
                               "Showing the latest " + ADMIN_LIMIT + " studies only. ");
      if (ADMIN_LIMIT < 500) {
        const more = mkBtn(ar_en("اعرض حتى 500", "Show up to 500"), "gh");
        more.onclick = () => { ADMIN_LIMIT = 500; loadAdmin().catch(() => {}); };
        note.appendChild(more);
      }
    }
  }
  rows.forEach((s) => {
    const tr = document.createElement("tr");
    cell(tr, String(s.id), "num");
    cell(tr, s.account_name || "—");
    cell(tr, s.product || "—");
    cell(tr, s.market_pref || ar_en("الكل", "All"));
    const achip = studyChip(s);
    pill(tr, achip.text, achip.kind);
    cell(tr, String(s.launched_at || "—").slice(0, 16), "num");
    /* عدّادات التشغيلة (ترحيل 007) — أداة تشخيص «التقرير الفارغ»: مدة التشغيل
       وعدد الجلبات الحية/من المخزن. غيابها = «—» معلَنة لا صفر مختلَق. */
    const rs = s.run_stats || null;
    cell(tr, rs && rs.duration_s != null
         ? rs.duration_s + ar_en(" ث", "s") : "—", "num");
    /* وضعُ التشغيلة المنفَّذ فعلاً (`run_stats.mode`) — كان مخزَّناً ولا يُعرَض،
       فبقي الفرق بين «عميق» و«سريع» و«محاكاة» غير مرئيّ للمالك: صفٌّ اكتمل في
       ٧٫٢ ث بدا عطلاً وهو تشغيلة سريعة من عهدٍ سابق (بلاغ 2026-08-19). */
    cell(tr, rs && rs.mode ? dd(MODE_AR, MODE_EN, rs.mode) : "—");
    cell(tr, rs && (rs.live != null || rs.store != null)
         ? ar_en("حية ", "live ") +
           (rs.live == null ? ar_en("؟", "?") : rs.live) +
           ar_en(" · مخزن ", " · store ") +
           (rs.store == null ? ar_en("؟", "?") : rs.store)
         : "—", "num");
    /* R3: السببُ المعلَن يصل ١٠٠٠ حرفاً (BODY_MAX) — تُعرَض بدايتُه ويبقى
       كاملاً في `title`، فلا يمطّ الصفُّ الجدولَ ولا يُفقَد النصّ. */
    const _re = s.run_error ? String(s.run_error) : "";
    const _errTd = cell(tr, _re
         ? ar_en("فشل: ", "Failed: ") + _re.slice(0, 120)
         : (s.analysis_id ? ar_en("تحليل #", "Analysis #") + s.analysis_id : "—"));
    if (_re) _errTd.title = _re;
    /* إشراف المالك بقراره 2026-08-19 («المفروض الأدمن يشوف الدراسات»): نفس
       زرّي العميل حرفياً — لا نسخة ثانية من مسار العرض. الخادم يفتح الدراسات
       للأدمِن ويُقيّد كل فتحٍ تدقيقاً (`admin_study_view`). */
    const td = document.createElement("td");
    if (s.state === "completed" && s.analysis_id) {
      td.appendChild(viewReportBtn(s));
      td.appendChild(pdfBtn(s.id));
    } else {
      td.textContent = "—";
    }
    tr.appendChild(td);
    body.appendChild(tr);
  });
}

/* تكاليف البحث الداخلية — **سطح أدمِن حصراً** (قرار المالك 2026-08-17: تُخفى
   عن لوحة المصنع وتبقى هنا). غياب قاعدة المحرّك = غياب معلن لا صفر مختلَق. */
/* تكلفةُ تشغيلةٍ بعينها من مقاييس الأدمِن — يُستدعى عند فتح نافذة التقرير.
   سطحُ أدمِن حصراً: حمولةُ المصنع تمرّ من `strip_cost_keys` ولا تحمل تكلفة،
   والرقم هنا يأتي من `/admin/metrics` لا من عرض التقرير (لا مسار عرض ثانٍ). */
function _adminRunCost(analysisId) {
  if (!ME || ME.role !== "silk_admin" || !analysisId) return null;
  const recent = ((CACHE.metrics || {}).research_costs || {}).recent || [];
  const hit = recent.find((r) => Number(r.id) === Number(analysisId));
  /* نافذةُ المقاييس محدودة (أحدث ثماني تشغيلات): دراسةٌ أقدم منها كانت
     البطاقةُ تختفي لها بصمت — والصمت يُقرأ «بلا تكلفة». تُعلَن الفجوة بدل
     ذلك (ملاحظة مراجعة ذاتية §58). */
  if (!hit) return {missing: true};
  return hit.cost_usd != null ? {usd: Number(hit.cost_usd)} : {missing: true};
}

function renderResearchCosts(rc) {
  const body = $("costsBody");
  body.textContent = "";
  const empty = $("costsEmpty");
  if (!rc.available) {
    empty.textContent = ar_en("تعذّرت قراءة قاعدة تحليلات المحرّك من هذه الخدمة — ",
      "Could not read the engine analyses store from this service — ") +
      (rc.note || "");
    empty.classList.remove("hide");
    return;
  }
  const rows = rc.recent || [];
  empty.classList.toggle("hide", rows.length > 0);
  if (!rows.length) empty.textContent = ar_en("لا تشغيلات محفوظة بعد.", "No stored runs yet.");
  rows.forEach((r) => {
    const tr = document.createElement("tr");
    cell(tr, String(r.id), "num");
    cell(tr, r.product || "—");
    cell(tr, r.market || "—");
    cell(tr, r.cost_usd == null ? ar_en("غير مقيسة", "unmeasured")
         : "$" + Number(r.cost_usd).toFixed(2), r.cost_usd == null ? "" : "num");
    cell(tr, String(r.created_at || "").slice(0, 10), "num");
    body.appendChild(tr);
  });
  if (rows.length) {
    const tr = document.createElement("tr");
    cell(tr, "");
    /* R6 (FE-22): النافذةُ مُسمّاة — «أحدث ٨ تشغيلات» لا «المعروض» المبهم. */
    const td = cell(tr, ar_en("إجمالي أحدث ", "Total of the latest ") + (rc.window || rows.length) +
      ar_en(" تشغيلات (", " runs (") + rc.recent_priced_runs + ar_en(" مقيسة)", " measured)"));
    td.colSpan = 2;
    cell(tr, "$" + Number(rc.recent_total_usd || 0).toFixed(2), "num");
    cell(tr, "");
    body.appendChild(tr);
  }
}

/* قائمة الأسواق المرشّحة — من مرجع المحرّك العام `GET /markets` (خارج بادئة
   /platform فتُجلب خاماً). تُخبَّأ لجلسة الصفحة؛ تعذُّرها = إدخال يدوي iso3. */
async function _markets() {
  /* `[]` قيمةٌ صادقة في JS، فكان فشلُ الجلب يُخزَّن كأنه نجاح ويُقفِل المنسدل
     على «كل الأسواق» طوال عمر الصفحة بلا إعادة محاولة — والدراسة العميقة
     ترفض «كل الأسواق» (422 study_no_market_deep) فيصير المصنع بلا مخرج
     (بلاغ المالك 2026-08-19). قائمةٌ فارغة = محاولة جديدة في الفتح التالي. */
  if (CACHE.markets && CACHE.markets.length) return CACHE.markets;
  try {
    const r = await fetch("/markets");
    const rows = (await r.json()) || [];
    CACHE.markets = rows.filter((m) => m && m.iso3);
  } catch (_e) { CACHE.markets = []; }
  return CACHE.markets;
}

function _marketOptions(list, selected) {
  const opts = ['<option value="">' +
    ar_en("— كل الأسواق (ترتيب المحرّك) —", "— all markets (engine ranking) —") +
    '</option>'];
  let found = !selected;
  list.forEach((m) => {
    if (selected === m.iso3) found = true;
    opts.push('<option value="' + esc(m.iso3) + '"' +
      (selected === m.iso3 ? " selected" : "") + ">" +
      esc(m.name_ar || m.name || m.iso3) + "</option>");
  });
  // تفضيل محفوظ خارج القائمة المجلوبة يبقى خياراً محدّداً — لا مسح صامت (§58).
  if (!found)
    opts.splice(1, 0, '<option value="' + esc(selected) + '" selected>' +
      esc(selected) + "</option>");
  return opts.join("");
}

/* صورة → منتج + رمز HS (قرار المالك): زرٌّ داخل نافذة الدراسة يقرأ الصورة
   المختارة عبر `/platform/classify-image`: رمز واحد أو إدخال يدوي، بلا نسب ثقة.
   Preserve a factory-supplied code, including edits made while the request runs. */
async function _classifyInto(veil, statusEl) {
  const hsEl = veil.querySelector('[name="hs_code"]');
  const prodEl = veil.querySelector('[name="product"]');
  const originalProduct = prodEl ? prodEl.value : "";
  if (hsEl && hsEl.value.trim()) {
    statusEl.textContent = ar_en("سيُستخدم رمز HS الذي أدخلته. امسحه إذا أردت تحديده من الصورة.",
      "Your HS code will be used. Clear it to classify from the photo.");
    return;
  }
  const iid = val(veil, "image_id");
  const imageGeneration = veil._imageUploadGeneration;
  if (!iid) { statusEl.textContent = ar_en("ارفع صورة المنتج أولاً من الحقل أعلاه.",
    "Upload the product photo first from the field above."); return; }
  statusEl.textContent = ar_en("جارٍ قراءة الصورة…", "Reading the photo…");
  try {
    const out = await api("/classify-image", {
      method: "POST", body: JSON.stringify({image_id: Number(iid)})
    });
    if (val(veil, "image_id") !== iid || veil._imageUploadGeneration !== imageGeneration) return;
    if ((hsEl && hsEl.value.trim()) || (prodEl && prodEl.value !== originalProduct)) {
      statusEl.textContent = ar_en("تغيّرت بيانات المنتج؛ احتفظنا بتعديلاتك. أعد قراءة الصورة عند الحاجة.",
        "Product details changed; your edits were kept. Read the photo again if needed.");
      return;
    }
    if (!out.ok) {
      statusEl.textContent =
        out.message || ar_en("أرفق صورة واضحة لبيانات المنتج أو أدخل رمز HS الخاص به.",
          "Add a clear photo of the product label or enter its HS code.");
      return;
    }
    if (prodEl && out.product_name) prodEl.value = out.product_name;
    let msg = ar_en("المنتج المقروء: ", "Product read: ") + (out.product_name || "—");
    if (out.hs6) {
      if (hsEl) { hsEl.value = out.hs6; hsEl._imageCode = out.hs6; hsEl._hsSource = "unknown"; }
      msg += ar_en(" · رمز HS: ", " · HS code: ") + out.hs6;
    } else {
      msg += " · " + ar_en("أدخل رمز HS الخاص بمنتجك.", "Enter your product's HS code.");
    }
    statusEl.textContent = msg;
  } catch (e) {
    if (val(veil, "image_id") !== iid || veil._imageUploadGeneration !== imageGeneration) return;
    statusEl.textContent = ar_en("تعذّرت القراءة: ", "Could not read it: ") + e.message;
  }
}

/* تسمية حقل التكلفة تتبع وحدة سوق المنتج المكتوب — «تكلفة إنتاج اللتر
   الواحد» للحليب، «الكيلوغرام» للتمور. الفشل صامت: تبقى التسمية العامة. */
function _wireCostUnitHint(veil) {
  const prod = veil.querySelector('[name="product"]');
  const label = veil.querySelector('[data-role="cost-label"]');
  if (!prod || !label) return;
  const update = async () => {
    const p = (prod.value || "").trim();
    if (!p) return;
    try {
      const h = await api("/unit-hint?product=" + encodeURIComponent(p));
      const unitAr = h.code === "litre" ? "اللتر الواحد" : "الكيلوغرام الواحد";
      const unitEn = h.code === "litre" ? "litre" : "kilogram";
      label.textContent = ar_en("تكلفة إنتاج " + unitAr + " (اختياري)",
                                "Production cost per " + unitEn + " (optional)");
    } catch (e) { /* تلميحٌ لا شرط — التسمية العامة تبقى */ }
  };
  prod.addEventListener("change", update);
  prod.addEventListener("blur", update);
  update();
}

function _wireStudyForm(veil, s) {
  _wireCostUnitHint(veil);
  _markets().then((list) => {
    const sel = veil.querySelector('[name="market_pref"]');
    if (sel) sel.innerHTML = _marketOptions(list, s && s.market_pref);
    // لا قائمة ⇒ اكشف الإدخال اليدوي بدل ترك المصنع بخيار واحد يرفضه الخادم.
    const man = veil.querySelector('[data-role="market-manual"]');
    if (man && !list.length) man.style.display = "";
  });
  const btn = veil.querySelector('[data-act="classify"]');
  const status = veil.querySelector('[data-role="classify-status"]');
  if (btn && status)
    btn.onclick = () => { btn.disabled = true;
      const generation = veil._imageUploadGeneration;
      _classifyInto(veil, status).finally(() => {
        if (veil._imageUploadGeneration === generation) btn.disabled = false;
      }); };
  const fileEl = veil.querySelector('[name="image_file"]');
  const hsEl = veil.querySelector('[name="hs_code"]');
  if (hsEl) {
    hsEl._hsSource = s && s.hs_source === "manual" ? "manual" : "unknown";
    hsEl.addEventListener("input", () => {
      delete hsEl._imageCode;
      hsEl._hsSource = hsEl.value.trim() ? "manual" : "unknown";
    });
    const productEl = veil.querySelector('[name="product"]');
    if (productEl) productEl.addEventListener("input", () => { hsEl._hsSource = "unknown"; });
  }
  if (fileEl && status)
    fileEl.addEventListener("change", async () => {
      const f = fileEl.files[0];
      if (!f) return;
      const generation = (veil._imageUploadGeneration || 0) + 1;
      veil._imageUploadGeneration = generation;
      veil.querySelector('[name="image_id"]').value = "";
      // رمز صورة سابقة لا يُنسب للجديدة؛ إدخال المصنع يبقى محفوظاً.
      // Only clear a code this form inferred from its previous photo.
      if (hsEl && hsEl._imageCode && hsEl.value === hsEl._imageCode) hsEl.value = "";
      if (hsEl) delete hsEl._imageCode;
      if (btn) btn.disabled = true;
      status.textContent = ar_en("جارٍ رفع الصورة…", "Uploading the photo…");
      try {
        const out = await uploadImage(f);
        if (veil._imageUploadGeneration !== generation) return;
        veil.querySelector('[name="image_id"]').value = out.id;
        // القراءة تلقائية بعد الرفع؛ الرمز اليدوي يحفظه _classifyInto دون نداء.
        // Read automatically after upload; manual codes avoid a vision call.
        await _classifyInto(veil, status);
      } catch (e) {
        if (veil._imageUploadGeneration !== generation) return;
        fileEl.value = "";
        status.textContent = ar_en("تعذّر الرفع: ", "Upload failed: ") + e.message;
      } finally {
        if (btn && veil._imageUploadGeneration === generation) btn.disabled = false;
      }
    });
}

function _studyBody(veil) {
  // الإدخال اليدوي يسدّ مكان المنسدل حين يتعذّر (لا يُلغيه): المنسدل أولاً.
  // المُدخَل اليدوي يفوز حين كتبه المصنع: المنسدل يحتفظ بالتفضيل القديم
  // كخيارٍ محدَّد عند التعديل، فكان يبتلع البديل في الحالة التي وُجد لها.
  const manual = (val(veil, "market_manual") || "").toUpperCase();
  const body = {
    product: orNull(val(veil, "product")),
    market_pref: orNull(manual || val(veil, "market_pref")),
    hs_code: orNull(val(veil, "hs_code")),
    image_id: val(veil, "image_id") === "" ? null : Number(val(veil, "image_id")),
    description_ar: orNull(val(veil, "description_ar")),
    /* البند ٢: الفراغ يُرسَل null صراحةً (مسحٌ مقصود) — عقد E-04 نفسه. */
    production_cost: val(veil, "production_cost") === ""
      ? null : Number(val(veil, "production_cost"))
  };
  // ربط المنتج (2026-08-18) — حقل خفي يزرعه مسار «ابدأ دراسة» من الكتالوج.
  const pid = veil.querySelector('[name="product_id"]');
  if (pid && pid.value) body.product_id = Number(pid.value);
  // مصدر يدوي عند كتابة المصنع فقط؛ لا ترقية لرمز قديم أو ناتج صورة.
  // Explicit factory input only; resaving a legacy/image value is not confirmation.
  const hsEl = veil.querySelector('[name="hs_code"]');
  body.hs_source = body.hs_code && hsEl && hsEl._hsSource === "manual" ? "manual" : "unknown";
  return body;
}

function studyDialog(fromProduct) {
  /* `fromProduct` (قرار 2026-08-18): «ابدأ دراسة» من بطاقة منتجٍ تعبّئ اسمه
     ورمزه وصورته وتربط الدراسة به (`product_id`) — كتالوجٌ يغذي الدراسات. */
  const p = fromProduct && fromProduct.id ? fromProduct : null;
  const seed = p ? {product: p.name, hs_code: p.hs_code,
                    image_id: p.image_id} : null;
  const veil = dialog(ar_en("دراسة سوق جديدة", "New market study"),
    _studyFormHtml(seed) +
    (p ? '<input type="hidden" name="product_id" value="' + p.id + '">' : "") +
    '<p class="hint">' +
    ar_en("تُنشأ بحالة «مسودّة» — الإطلاق يشغّل محرّك سِلك تلقائياً ويستهلك دراسة من حصّة باقتك. المنتج إلزامي للإطلاق.",
       "Created as a draft — launching runs the Silk engine automatically and consumes one study from your plan quota. The product is required to launch.") +
    "</p>" +
    /* §15 (الموجة ٠): **مؤشّرٌ إعلاميّ لا منتقٍ**. لغة التقرير محسومةٌ من
       إعدادات المصنع، فلا يُسأل عنها المصنعُ عند كل دراسة؛ يُعرَض ما ستكون
       عليه، ومكانُ تغييرها «الملف التعريفي ← لغة تقارير المصنع». */
    '<p class="hint" id="studyLangNote">' +
    ar_en("لغة التقرير: ", "Report language: ") +
    ((ME && ME.factory_language) === "en"
       ? ar_en("الإنجليزية", "English") : ar_en("العربية", "Arabic")) +
    ar_en(" — تُضبَط من «الملف التعريفي ← لغة تقارير المصنع».",
       " — set it in “Profile → Factory report language”.") +
    "</p>",
    async (v) => {
      const body = _studyBody(v);
      if (!body.product)
        throw new Error(ar_en("اكتب اسم المنتج.", "Enter the product name."));
      const out = await api("/studies", {
        method: "POST", body: JSON.stringify(body)
      });
      tell(ar_en("أُنشئت دراسة «", "Study created “") + (body.product || "") +
           ar_en("» #", "” #") + out.id +
           ar_en(" — اضغط «إطلاق» لبدء الإعداد.",
              " — press “Launch” to start preparation."), "good");
    }, ar_en("إنشاء", "Create"));
  _wireStudyForm(veil, seed);
}

/* ── نسيت كلمة المرور — قبل الدخول، فلا loadAll ولا رسائل داخل التطبيق ── */

  dialog(ar_en("نسيت كلمة المرور", "Forgot password"),

      '</label><input name="email" type="email" dir="ltr">' +

    ar_en("إن كان البريد مسجَّلاً فستصلك رسالة برابط إعادة التعيين (صالح ٣٠ دقيقة). الردّ واحد في الحالتين — لا نكشف وجود الحسابات.",
       "If the email is registered you will receive a reset link (valid 30 minutes). The response is identical either way — we do not reveal whether accounts exist.") +
    "</p>",
    async (veil) => {

             "If the email is registered a reset link is on its way. If email is unavailable, ask the admin for a token via support."),

/* المخطّط يُقاس بالبكسل من حاويته — و`loadHome` تجري **قبل** أن يُفتح اللوح،
   فالحاوية مخفيّة وعرضُها صفر ويسقط القياس إلى العرض الثابت القديم: القياس
   الحقيقي لا يقع إلا حين تصير مرئيّة. مراقبُ الحجم يغطّي الحالتين معاً
   (أوّل ظهور، وتغيّر العرض/التدوير) بلا أي جلبٍ من الخادم. */
const _chartLastW = {};
/* المراقب يخدم **المخطّطين**: مخطّط المصنع ومخطّط شهور الأدمِن — كان يخصّ
   الأول وحده، فبقي الثاني يُرسَم بمقياسٍ بلا حدّ (فحص شامل 2026-08-20). */
function _watchChart(hostId, draw) {
  const host = $(hostId);
  if (!host) return;
  const redraw = () => {
    const w = Math.round(host.clientWidth || 0);
    if (!w || w === _chartLastW[hostId]) return;
    _chartLastW[hostId] = w;
    draw(host);
  };
  if (typeof ResizeObserver === "function") {
    new ResizeObserver(redraw).observe(host);
  } else {                      // متصفّح بلا المراقب — تغيّر النافذة يكفي
    let t = null;
    window.addEventListener("resize", () => {
      clearTimeout(t); t = setTimeout(redraw, 180);
    });
  }
}

function _watchChartWidth() {
  _watchChart("marketsChart", (host) => {
    if (!CACHE.overview) return;
    renderMarketsChart(host, CACHE.overview.markets || [],
                       CACHE.overview.markets_note || "");
  });
  _watchChart("studiesChart", () => {
    if (!CACHE.metrics) return;
    renderStudiesChart(CACHE.metrics.studies_by_month || []);
  });
}
_watchChartWidth();

/* ── التوصيل ── */
/* إرسال النموذج هو المسار الوحيد للدخول الآن: `submit` يغطّي زرّ الدخول
   ومفتاح Enter من أيّ حقل معاً، فسقط مستمعا Enter اليدويان بلا فقدان سلوك
   (وبقاؤهما كان سيُطلق `doLogin` مرّتين مع الإرسال). */
$("loginForm").addEventListener("submit", (e) => {
  e.preventDefault();
  /* حارسٌ قبل الشبكة: Enter من حقل البريد كان يُرسل محاولةً بكلمة مرور فارغة،
     والخادم يعدّها محاولةً فاشلة حقيقية (عشرٌ لكل بريد/عنوان في ٣٠٠ث) —
     فخمسُ ضغطاتِ عادةٍ تقفل الحساب ٤٢٩. الحقلُ الفارغ يُنبَّه محلياً ويُركَّز
     عليه بلا أي طلب. */
  const email = $("email").value.trim(), pw = $("pw").value;
  if (!email || !pw) {
    say($("loginMsg"), ar_en("أدخل البريد وكلمة المرور معاً.",
      "Enter both your email and password."), "err");
    (!email ? $("email") : $("pw")).focus();
    return;
  }
  doLogin();
});

/* البحث محليّ فورّي — بلا debounce لأن التصفية على مصفوفة في الذاكرة لا
   نداءُ شبكة (sumi يوصي بـ300ms للمرشِّحات التي تضرب الخادم؛ هذه لا تضربه). */

$("pfSaveBtn").onclick = async () => {
  try {
    await api("/me", {method: "PATCH", body: JSON.stringify({
      first_name: $("pfFirst").value.trim(),
      last_name: $("pfLast").value.trim()})});
    tell(ar_en("حُفظت بياناتك.", "Your details were saved."), "good");

  } catch (e) { tell(e.message, "err"); }
};
$("pwSaveBtn").onclick = async () => {
  if ($("pwNew").value !== $("pwNew2").value) {
    tell(ar_en("تأكيد كلمة المرور لا يطابقها.",
               "The confirmation does not match."), "err");
    return;
  }
  try {
    await api("/me/password", {method: "POST", body: JSON.stringify({
      current_password: $("pwCur").value, new_password: $("pwNew").value})});
    $("pwCur").value = $("pwNew").value = $("pwNew2").value = "";
    tell(ar_en("غُيِّرت كلمة المرور — جلساتك الأخرى أُغلقت وهذه باقية.",
               "Password changed — other sessions were closed; this one stays."),
         "good");
  } catch (e) { tell(e.message, "err"); }
};
$("langBtn3").onclick = switchLang;
/* ── لغة تقارير المصنع (الموجة ٠) ──────────────────────────────────────────
   إعدادٌ **مستقلّ** عن `switchLang` أعلاه: ذاك يكتب `users.language_preference`
   (لغة شاشة هذا المستخدم) وهذا يكتب `accounts.language_preference` (لغة
   تقارير المصنع كلّه). لا يُشتقّ أحدهما من الآخر ولا يُستبدَل به.
   التدفّق كاملاً: اختيار ← حفظ ← PATCH ← إعادة قراءة `/me` ← تحديث المؤشّر. */
function renderReportLangCard() {
  const sel = $("rlangSel"), st = $("rlangState");
  if (!sel || !st) return;
  const cur = (ME && ME.factory_language) === "en" ? "en" : "ar";
  sel.value = cur;
  st.textContent = (ME && ME.factory_language_chosen)
    ? (cur === "en"
        ? ar_en("تُولَّد التقارير حالياً بالإنجليزية.",
                "Reports are currently generated in English.")
        : ar_en("تُولَّد التقارير حالياً بالعربية.",
                "Reports are currently generated in Arabic."))
    : ar_en("لم تُختَر بعد — التقارير تُولَّد بالعربية افتراضياً.",
            "Not chosen yet — reports are generated in Arabic by default.");
}
$("rlangSaveBtn").onclick = async () => {
  const val = $("rlangSel").value === "en" ? "en" : "ar";
  try {
    await api("/account/language", {method: "PATCH",
      body: JSON.stringify({language_preference: val})});
    tell(ar_en("حُفظت. الدراسات التي تُطلَق من الآن ستكون بهذه اللغة.",
               "Saved. Studies launched from now on will be in this language."),
         "good");
    await loadAll();            /* يُعيد قراءة /me فيتحدّث المؤشّر فعلاً */
    renderReportLangCard();
  } catch (e) {
    tell(e.message || ar_en("تعذّر حفظ لغة التقارير — أعد المحاولة.",
                            "Could not save the report language — try again."),
         "err");
  }
};
$("pfResetBtn").onclick = resetUserDialog;
/* أزرار «نظرة عامة» السريعة — نفس نوافذ الأفعال القائمة، صفر نقاط جديدة. */
$("diagBtn").onclick = () => runDiagnostics($("diagBtn"));
$("tierAcctBtn").onclick = () => tierDialog(null, null);
$("quotaAcctBtn").onclick = () => quotaDialog(null, null);
$("sideToggle").onclick = () => $("sideBar").classList.toggle("open");

$("langBtn").onclick = switchLang;
if (LANG === "en") setLang("en");   // التقط الأصل العربي وبدّل قبل أي عرض

/* جلسة قائمة؟ الكوكي httponly لا يُقرأ من JS، فنستدل بعلامة محلية تُختم
   عند الدخول وتُمسح عند الخروج — بلاها لا جسّ أصلاً، فلا خطأ 401 أحمر في
   كونسول كل زائر لشاشة الدخول (جولة 2026-08-17). */
(async () => {
  if (!localStorage.getItem("silk_has_session")) return;
  try {
    await api("/me");
    $("loginView").classList.add("hide");
    $("appView").classList.remove("hide");
    await loadAll();
    await handleOpportunityReturn();
  } catch (_e) { localStorage.removeItem("silk_has_session"); }
})();
</script>
