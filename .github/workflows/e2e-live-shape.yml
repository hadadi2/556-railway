# رُتبتا الاختبار ٢–٣ كوظيفة CI مطلوبة (e2e-live-shape).
#
# القاعدة الجديدة (تأكيد المالك آخِراً لا أوّلاً): قبل أن يُوسَم أيّ PR يمسّ
# سلوكاً إنتاجياً «جاهزاً»، نستنفد كل رُتب الاختبار. هذه الوظيفة تُشغّل:
#   • رُتبة ٢ — خادم uvicorn حقيقي على SQLite مبذور بالمدوّنة القانونية، يُضرَب
#     بـHTTP حقيقي (tests/test_rung2_real_server.py).
#   • رُتبة ٣ — chromium (headless) ينقر الواجهة الفعلية: لوحة ← شريط جانبي ←
#     تقرير ← تصدير Word/Markdown ← صندوق التقدّم (tests/test_rung3_*).
#
# **حماية الفرع (يضبطها المالك في GitHub):** اجعل الفحص «e2e-live-shape»
# مطلوباً على main. أيّ PR يمسّ web/index.html أو أيّ مسار تصدير/تقرير لا
# يُدمَج حتى يخضرّ تدفّق Playwright — هذا التدفّق كان سيلتقط خطأَي التصدير
# والشريط الجانبي الميت قبل المالك.

name: e2e-live-shape

on:
  push:
  pull_request:

jobs:
  e2e-live-shape:
    runs-on: ubuntu-latest
    # نفس منطق ci.yml (الافتراضي ٦ ساعات) بهامش أوسع: هذه الوظيفة تُثبِّت
    # LibreOffice وخطوطاً وchromium وتُقلِع خادماً حقيقياً، فتُكمل عادةً في
    # ~٣–٥ دقائق؛ ٣٠ يقتل التعليق ولا يُسقِط تثبيتاً بطيئاً.
    # Same rationale as ci.yml, wider margin (installs LibreOffice + chromium).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # محرّك تحويل PDF (LibreOffice/soffice) + خطّ عربي الشكل — رُتبة ٣ تنقر
      # زرّ «تصدير التقرير (PDF)» وتؤكّد توقيع %PDF؛ بلا هذين يقع الخادم في
      # فرع 503 فيفشل الفحص. نفس التبعية المطلوبة على النشر (Dockerfile).
      - name: Install LibreOffice + Arabic fonts (PDF converter)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-hosny-amiri fontconfig poppler-utils
          # §7: العائلة الرسمية IBM Plex Sans Arabic (OFL) من google/fonts —
          # Regular+Bold+SemiBold. بلا Plex يبدّل LibreOffice صامتًا فيسقط قبول §7.
          sudo mkdir -p /usr/share/fonts/truetype/ibmplex
          # نفس مصدر وبصمات صورة الإنتاج. Reuse the Docker pin and checksums.
          font_commit=$(sed -n 's/^ARG GOOGLE_FONTS_COMMIT=//p' Dockerfile)
          [[ "$font_commit" =~ ^[0-9a-f]{40}$ ]]
          for w in Regular Bold SemiBold; do
            sudo curl -fsSL -o "/usr/share/fonts/truetype/ibmplex/IBMPlexSansArabic-$w.ttf" \
              "https://raw.githubusercontent.com/google/fonts/$font_commit/ofl/ibmplexsansarabic/IBMPlexSansArabic-$w.ttf"
          done
          (cd /usr/share/fonts/truetype/ibmplex && sha256sum -c "$GITHUB_WORKSPACE/docker/fonts.sha256")
          fc-cache -f

      # pymupdf تبعيةٌ صلبةٌ لهذه الوظيفة (مقياسُ الهندسة §4 يُجمِّع الأسطر على y
      # عبر fitz) — ومنذ تدقيق 2026-08-27 صارت تبعيةَ **إنتاج** في
      # `requirements.txt` أيضاً، فحارسُ اتجاه الأقواس يعمل على النشر لا هنا
      # وحدَه. لذلك حُذِفت من سطر التثبيت: مصدرٌ واحدٌ للإصدار، لا نسختان
      # تفترقان بصمت. Single source of truth for the pinned version.
      - name: Install Python dependencies
        # مثبَّتة بإصدارات محدّدة كنظيراتها في requirements.txt (تدقيق البند ١٦):
        # إصدارُ pytest/httpx جديدٌ كان يستطيع تغيير دلالات CI أو تحميرها بصفر
        # تغيير في الريبو. Pinned like requirements.txt — CI must be reproducible.
        run: pip install -r requirements.txt -r requirements-ci.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # playwright مثبّتة عمومياً كي يحلّها require عبر NODE_PATH (مثل البيئة
      # المُدارة). الإصدار مثبَّت مطابقاً لما جُرّب حياً (1.56.1).
      - name: Install Playwright + chromium
        run: |
          npm install -g playwright@1.56.1
          npx --yes playwright@1.56.1 install --with-deps chromium

      - name: Run rungs 2-3 (real server + real browser)
        env:
          SILK_RUN_E2E: "1"
        # تدقيق 2026-08-27 (البند ٣): `test_rung2_factory_language_flow.py`
        # موسوم `e2e` (فيتخطّاه `pytest tests/ -q` الهرمتي) وكان **غائباً عن
        # هذا السطر** — أي لا يشغّله أيّ مسار: تدفّق لغة تقرير المصنع كاملاً بلا
        # حارس. إضافتُه هنا هي كلّ ما يلزم كي يعود للتنفيذ.
        # R2 (2026-09-02): `test_rung2_restart_drill.py` — إيقاف الخادم أثناء دراسة
        # جارية ثم إقلاعه على نفس البيانات: لا دراسة تبدو سليمةً وهي ميتة.
        run: python -m pytest tests/test_rung2_real_server.py tests/test_rung2_factory_language_flow.py tests/test_rung2_restart_drill.py tests/test_rung3_playwright_e2e.py tests/test_rung4_platform_real_bridge.py -q

      # الشرط ٣ (مراجعة المُشرِف): خطٌّ عربيّ الشكل حاضرٌ — فشلٌ عالٍ إن غاب،
      # وإلا يُصيَّر الـPDF tofu فيمرّ القفلُ البصريّ زائفًا.
      - name: Assert IBM Plex Sans Arabic is present (loud — no silent substitution)
        run: |
          # §7 (قرار المالك): العائلة الرسمية يجب أن تكون حاضرةً — فشلٌ عالٍ إن
          # غابت، وإلا يبدّلها LibreOffice صامتًا فيمرّ القبول زائفًا.
          fc-list | grep -iE "plex sans arabic|ibmplexsansarabic" \
            || { echo "::error::IBM Plex Sans Arabic not installed"; exit 1; }

      # معايرةُ المقياس (أمر المُشرِف، الخيار ٣): قبل الوثوق بأيّ رقمٍ هندسيّ،
      # اطبع مصفوفة 2×2 (A=jc=start صحيح، B=jc=right مقلوب) بطريقتَي قياس +
      # نسخة LibreOffice. تشخيصيّ (لا يُفشِل الوظيفة) — القراءةُ من سجلّ CI.
      - name: RTL measurer calibration (diagnostic 2x2 matrix)
        run: python3 tools/rtl_calibration.py

      # الطيّة E + الشروط ٢/٤ (Wave 2): القفلُ البصريّ عبر مسار الإنتاج
      # (`render_client_pdf`) + كنسُ التسريب (§2) على النصّ العاري + اختبارُ
      # الهندسة (§4، محاذاة RTL) على الـPDF **المجرّد** — يحتاج soffice+pdftotext
      # (هنا لا في وظيفة `test`). SILK_PDF_ACCEPTANCE=1 يُلزِم اختبار الهندسة
      # بالتنفيذ الفعليّ لا التخطّي.
      - name: Run Wave 2 visual PDF lock (fold E) + geometry + leak sweep
        env:
          SILK_PDF_ACCEPTANCE: "1"
        run: |
          python -m pytest tests/test_wave2_first_pdf_cluster.py \
            tests/test_report_output_overhaul.py \
            tests/test_wave3_typography.py \
            tests/test_factory_report_language.py -q

  # R0 (تدقيق 2026-09-01، CI-4): الصورة تُبنى **كما يبنيها Railway** وتُقلِع
  # وتُضرَب على /health داخل الحاوية — Dockerfile مكسور أو تبعية نظام غائبة
  # كانا يُكتشَفان بعد النشر لا قبله. وظيفة مستقلة كي لا تطيل رُتبتَي ٢–٣، وبلا
  # أسرار: بناءٌ يحتاج مفتاحاً بناءٌ لا يُعاد إنتاجه. حارس القرص الدائم
  # (SILK_REQUIRE_PERSISTENT_DATA_DIR) اختياريّ في الصورة فيبقى مطفأً هنا.
  # Build the deploy image exactly as Railway does, boot it, curl /health inside.
  docker-health:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the deploy image (same Dockerfile Railway builds)
        run: docker build -t silk:ci .
      - name: Boot the container and hit /health inside it
        run: |
          docker run -d --name silk-ci -p 8000:8000 -e PORT=8000 \
            -e SILK_DATA_DIR=/tmp/silk-data silk:ci
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8000/health > /tmp/health.json; then
              echo "::group::/health"; cat /tmp/health.json; echo; echo "::endgroup::"
              exit 0
            fi
            sleep 2
          done
          echo "::error::/health never answered 200 inside the built image"
          docker logs silk-ci
          exit 1
      - name: Assert the server runs unprivileged (R7 / SEC-8 — pid 1 uid is 10001 = silk)
        run: |
          uid="$(docker exec silk-ci sh -c "awk '/^Uid:/{print \$2}' /proc/1/status")"
          echo "pid 1 uid=$uid"
          test "$uid" = "10001"
      - name: Container logs (always — the evidence when the step above fails)
        if: always()
        run: docker logs silk-ci 2>&1 | tail -n 100 || true
