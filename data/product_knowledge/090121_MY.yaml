claims:
  - id: chains_require_halal
    text: "سلاسل التجزئة الكبرى، مثل AEON وMydin، تشترط هذه الشهادة للتعاقد، في حين لا تشترطها المتاجر المتخصصة مثل Jaya Grocer ولا منصات التجارة الإلكترونية"
    anchors: [AEON, Mydin, Jaya Grocer, السلاسل الكبرى, سلاسل التجزئة الكبرى]
    predicate: تشترط
paragraphs:
  s1_decomp.world_price_note: "، مع الأخذ في الاعتبار أن أسعار البن العالمية ارتفعت بحدة في تلك الفترة"
  s1_suppliers.hub_note: "وسنغافورة لا تُعد دولة منتجة للبن، وإنما مركز إعادة تصدير، وبالتالي فإن المنافسة الفعلية على مستوى المنشأ تنحصر في منتجين إقليميين منخفضي التكلفة هما إندونيسيا وفيتنام، إلى جانب محمّص أوروبي متخصص هو إيطاليا."
  s1_hub_trend.interpretation: "وقد يعكس تراجع عام 2024 توجه بعض المستوردين إلى الشراء المباشر من الدول المزارعة بدلاً من الوسطاء، وهو تحول يفيد الدول المنتجة للبن في المقام الأول ولا ينعكس بالضرورة على مصدّر يحمّص بناً مستورداً."
  s1_border.commercial_word: "البن التجاري بالجملة"
  s1_border.commercial_word_short: "البن التجاري"
  s2_survey: "يُظهر استطلاع أكاديمي ماليزي لم تتوفر ضمن مصادر هذه الدراسة بياناته الببليوغرافية الكاملة (اسم الدراسة وسنة نشرها وحجم عينتها)، ويُعامل لذلك مؤشراً استرشادياً لا أساساً وحيداً للقرار، أن 77.6% من المستجيبين يستهلكون القهوة يومياً، وأن 92.5% منهم يحضّرونها في المنزل أو مكان العمل، بينما يشتري 62.7% منهم القهوة الجاهزة أقل من مرة أسبوعياً بسبب محدودية الدخل المتاح. وتشير هذه النتائج إلى أن الاستهلاك المنزلي هو النمط السائد، وأن منافذ التجزئة والتجارة الإلكترونية تمثل القنوات الأنسب للوصول إلى المستهلك، لا قنوات المقاهي."
  s2_caveat: "غير أنه يتعين التحفظ في تفسير هذه النتائج؛ فالإعداد المنزلي للقهوة في ماليزيا يعتمد في معظمه على القهوة سريعة التحضير والخلطات الجاهزة، ولا تتوفر بيانات تحدد حجم الشريحة التي تشتري البن المحمص الصافي تحديداً. وتُعد هذه الشريحة الأضيق هي السوق الفعلية للمنتج السعودي، ويبقى تقدير حجمها غير مثبت."
  s2_patterns: "وتنقسم ثقافة استهلاك القهوة في ماليزيا إلى نمطين رئيسيين: النمط التقليدي المعروف بـ\"الكوبي\"، وهو بن يُحمّص مع السكر والزبدة ويُقدَّم في المقاهي الشعبية، ويتمتع بذوق محلي راسخ يصعب على منتج مستورد منافسته؛ والنمط الحديث للقهوة المختصة الذي تقبل عليه الفئات الشابة الحضرية، وهي فئة أكثر تقبلاً للمنتجات الجديدة وأعلى استعداداً للدفع. ويُعد النمط الثاني هو الموضع الطبيعي للمنتج السعودي."
  s3_local_competitors: "ولا تقتصر المنافسة على الواردات؛ إذ تنشط في السوق محامص محلية راسخة حاصلة على شهادات حلال وتمتلك علاقات توزيع قائمة، من أبرزها Mr. Coffee العاملة منذ عام 1982، وLiberty Coffee، وLighthouse Coffee. ويُتوقع أن يقارن الموزعون المنتج السعودي بمنتجات هذه المحامص أولاً، لا بالواردات الإقليمية."
  s3_advantage: "**الميزة التنافسية للمنتج السعودي:** لا يمكن للمنتج السعودي المنافسة على أساس التكلفة، نظراً لاعتماد المحامص السعودية على استيراد البن الأخضر، في مقابل منافسين يزرعونه محلياً. وتنحصر الميزة الممكنة في ثلاثة محاور: تمايز المنشأ (بن جازان الخولاني)، أو تمايز المنتج (القهوة العربية بالهيل)، أو موثوقية شهادة الحلال. ويُلاحظ أن إنتاج بن جازان محدود الكمية ومرتفع السعر محلياً، فلا يُعتد به ميزة إلا بعد التحقق من توفر كميات تصديرية بتكلفة مقبولة. وإضافة الهيل أو غيره قد تُخرج المنتج من البند الجمركي 090121، وهو ما يستلزم التحقق من التصنيف قبل أي إجراء."
  s3_freshness: "**عامل الطزاجة:** يفقد البن المحمص خصائصه الحسية خلال أسابيع من التحميص، وتولي شريحة القهوة المختصة اهتماماً بالغاً بتاريخ التحميص. ويستغرق الشحن البحري من موانئ المملكة إلى ميناء كلانج أسبوعين إلى ثلاثة في العادة، يُضاف إليها التخليص والتخزين والتوزيع، بحيث قد تمضي فترة تقارب الشهرين قبل وصول المنتج إلى المستهلك. ويستوجب ذلك اعتماد عبوات مزودة بصمام تنفيس وتعبئة بالنيتروجين، والتحقق من الحد الأدنى لعمر الرف الذي يشترطه الموزع، ودراسة الشحن الجوي للشحنة التجريبية."
  s4_halal_channels: "ويُفاد بأن سلاسل التجزئة الكبرى، مثل AEON وMydin، تشترط هذه الشهادة للتعاقد، في حين لا تشترطها المتاجر المتخصصة مثل Jaya Grocer ولا منصات التجارة الإلكترونية؛ وهذه معلومة تجارية غير مستندة إلى وثيقة منشورة، ويتعين التحقق منها لدى كل منفذ قبل الاعتماد عليها."
  s5_channel_para: "توصي الدراسة بالدخول عبر مستورد أو موزع قهوة محلي يخدم منافذ التجزئة المتخصصة ومنصتي التجارة الإلكترونية Shopee وLazada، دون التوجه المباشر إلى سلاسل التجزئة الكبرى في المرحلة الأولى. ويستند ذلك إلى ثلاثة اعتبارات: أن الاستهلاك منزلي بالدرجة الأولى، وأن السلاسل الكبرى يُفاد بأنها تشترط شهادة حلال لم تُستكمل بعد، وأن الموزع المحلي يتحمل أعباء التسجيل والتخليص ويوفر معرفة بمستويات الأسعار المقبولة."
  s5_directories: "من دليل JAKIM للمنشآت المعتمدة (بالبحث عن kopi) وقوائم عارضي معرض MIHAS في كوالالمبور"
  s7_commodity: "**أسعار البن العالمية:** شهدت أسعار البن الأخضر ارتفاعاً حاداً في عام 2025، وهو ما يرفع تكلفة الإنتاج لدى المصدّر ويدفع المحامص المحلية إلى تقليل الاعتماد على الاستيراد."
  s8_counter_local_taste: "ومحامص محلية معتمدة تلبي ذوقاً محلياً يختلف جوهرياً عن القهوة العربية"
  s8_rationale: "فالمسار المقترح يستهدف شريحة الاستهلاك المنزلي للقهوة المختصة الباحثة عن منتج متمايز وحلال، عبر قناة لا تشترط الاعتماد الكامل، وبشحنة تجريبية محدودة المخاطر."
  s9_plan_rows:
    - ["الأسبوع 1", "تحديد جهتين أو ثلاث من مستوردي القهوة عبر دليل JAKIM وقوائم MIHAS، والتواصل معها ومع De Espresso Coffee لطلب عروض أسعار جملة", "المتطلب الرابع", "المبيعات"]
    - ["الأسبوع 1", "التحقق من قائمة JAKIM للجهات الأجنبية المعترف بها، ومخاطبة الجهة السعودية المدرجة إن وُجدت بشأن مدة وتكلفة الاعتماد", "المتطلب الثالث", "الامتثال"]
    - ["الأسبوع 2", "رصد سعر رف لمحمصة ماليزية مختصة واحدة على الأقل، وطلب ثلاثة عروض شحن بحري وجوي", "المتطلب الثاني وكلفة الدخول", "المبيعات واللوجستيات"]
    - ["الأسابيع 5–8", "شحنة تجريبية واحدة عبر موزع واحد، بالشحن الجوي إن لم تكتمل تصاريح الحجر وتسجيل FoSIM بما يسمح بالشحن البحري في هذه المهلة، مع بند لتصريف البضاعة غير المباعة أو تقاسم كلفة التخفيض", "—", "الإدارة"]
  s9_review_triggers: "تجاوز التكلفة الواصلة 40% إلى 45% من سعر رف المحمصة المختصة المرصود (وإلى حين رصده، 15 دولاراً للكيلوغرام كحد مؤقت)؛ أو رفض الموزع لعمر الرف المتاح بعد الشحن؛ أو تجاوز مدة اعتماد الحلال ستة أشهر، وفي هذه الحالة يُقتصر على القنوات الإلكترونية والمتخصصة إلى حين استكماله."
