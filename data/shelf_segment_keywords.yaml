# شرائح أسعار الرف لنمط «دراسة السوق» (P4-2). كل صف رف يأخذ أول شريحة تطابق نصه
# (اسم المنتج/الملاحظة/المصدر)، بالترتيب أدناه؛ لا مطابقة ⇒ «غير محدد». «غير مكافئ»
# يُخرج الصف من حساب العتبة (equivalent=false). كلمات عامة لا أسماء أسواق.
order: [غير مكافئ, مختص, تقليدي, جماهيري]
segments:
  غير مكافئ: ["instant", "3in1", "3 in 1", "2in1", "mix", "سريعة التحضير", "خلطة", "كبسولات", "capsule"]
  مختص: ["specialty", "single origin", "single-origin", "micro lot", "مختص", "مختصة", "محمصة مختصة"]
  تقليدي: ["traditional", "kopi", "تقليدي", "تقليدية"]
  جماهيري: ["nescafé", "nescafe", "nestlé", "nestle", "lavazza", "starbucks", "jacobs", "maxwell", "علامة عالمية"]
# الشريحة المستهدفة للمنتج (product.segment في الحالة) ← اسم الشريحة هنا.
target:
  specialty: مختص
  mass: جماهيري
  traditional: تقليدي
