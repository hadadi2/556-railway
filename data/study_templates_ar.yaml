# قوالب نمط «دراسة السوق التصديرية» — study_templates_ar (P0-T).
# النص الثابت منقول حرفياً من samples/golden_malaysia_coffee_study.md؛ الفراغات {…} تملؤها
# silk_study_render من أرقام silk_study_numbers وملف المعرفة. النسخ غير المرجعية معتمدة
# بقرار المالك 2026-09-26 (docs/plans/STUDY_TEMPLATE_VARIANTS_REVIEW.md). لا فعل اتجاه
# مكتوباً صلباً خارج {dir:…} (اختبار tests/test_study_templates.py).
version: 1

clauses:
  market_def:
    select: market_def
    variants:
      no_entry: "سوقاً محدودة الجاذبية لـ{product_short} في الوقت الراهن"
      defer: "سوقاً معتبرة الحجم لـ{product_short}، غير أن مؤشراتها لا تكفي لقرار دخول في الوقت الراهن"
      down: "سوقاً متراجعة الواردات من {product_short}"
      flat: "سوقاً مستقرة الحجم لـ{product_short}"
      up: "سوقاً واعدة لـ{product_short}"
  ease_clause:
    select: market_def
    variants:
      up: "، غير أنها ليست سوقاً سهلة الدخول"
      no_entry: "، كما أنها ليست سوقاً سهلة الدخول"
      down: "، كما أنها ليست سوقاً سهلة الدخول"
      flat: "، كما أنها ليست سوقاً سهلة الدخول"
      defer: ""
  growth_clause:
    select: shape_trend
    variants:
      up: "ب{dir:shape_g_first_last:زيادة|تراجع} تقارب {shape_g_first_last:pct0} عن عام {shape_y_first}"
      down: "ب{dir:shape_g_first_last:زيادة|تراجع} يقارب {shape_g_abs:pct0} عن عام {shape_y_first}"
      flat: "بما يعادل تقريباً مستوى عام {shape_y_first}"
  tariff_clause:
    select: tariff_status
    variants:
      exempt: "يُعفى المنتج من الرسوم الجمركية"
      rate: "يخضع المنتج لرسم جمركي بنسبة {tariff:pct0}"
      gap: "لم يُتحقق بعد من الرسم الجمركي المنطبق"
  dominance_clause:
    select:
      - {when: "hhi_band == not_computed", use: no_shares}
      - {when: "hhi_band == below_1500", use: hhi_low}
      - {when: "hhi_band == straddles_1500", use: hhi_straddle}
      - {when: "hhi_band == straddles_2500", use: hhi_straddle}
      - {when: "hhi_band == between_1500_2500", use: hhi_mid}
      - {when: "top1_share >= 40", use: hhi_high_top1}
      - {when: else, use: hhi_high}
    variants:
      hhi_low: "دون هيمنة أي منها"
      hhi_straddle: "دون أن يتضح مستوى تركّز الواردات من الحصص المتاحة"
      hhi_mid: "مع تركّز متوسط في عدد محدود منها"
      hhi_high_top1: "مع هيمنة واضحة لـ{top1_partner}"
      hhi_high: "مع تركّز شديد في عدد محدود منها"
      no_shares: ""
  saudi_clause:
    select:
      - {when: saudi_absent, use: absent}
      - {when: "saudi_share == none", use: unknown}
      - {when: "saudi_share < 5", use: present_low}
      - {when: else, use: present}
    variants:
      absent: "لا يوجد مورّد سعودي في هذه السوق حالياً"
      unknown: "لا تظهر المملكة بين أكبر الدول المورّدة المرصودة لهذه السوق"
      present_low: "لا تتجاوز حصة المملكة {saudi_share:pct1} من هذه السوق حالياً"
      present: "تبلغ حصة المملكة {saudi_share:pct1} من هذه السوق حالياً"
  top3_clause:
    select:
      - {when: "top_n == 0", use: no_shares}
      - {when: "top_n < 3", use: few}
      - {when: top3_near, use: near}
      - {when: else, use: far}
    variants:
      near: "وتستحوذ ثلاث دول قريبة جغرافياً على {top3_frac} الواردات تقريباً"
      far: "وتستحوذ ثلاث دول على {top3_frac} الواردات تقريباً"
      few: "وتستحوذ {top_n:count(دولة, nom)} على {top3_frac} الواردات تقريباً"
      no_shares: "ولم تتوفر حصص الموردين لبيان تركّز الواردات"
  series_shape_clause:
    select:
      - {when: "shape_dip_year == none", use: up_steady}
      - {when: "shape_trend == up", use: up_bumpy}
      - {when: "shape_trend == down", use: down}
      - {when: else, use: flat}
    variants:
      down: "ولم يكن هذا التراجع مطرداً؛ إذ بلغت الواردات ذروتها في عام {shape_peak_year}، ثم {dir:shape_g_first_last:ارتفعت|تراجعت} في السنوات التالية حتى بلغت أدنى مستوياتها في عام {shape_min_year}."
      flat: "وتحركت الواردات خلال الفترة ضمن نطاق ضيق، بين {shape_min_value:m1} في عام {shape_min_year} و{shape_max_value:m1} في عام {shape_peak_year}."
      up_steady: "وكان هذا النمو مطرداً على امتداد الفترة، إذ لم تتراجع الواردات في أي سنة دون مستوى عام {shape_y_first}."
      up_bumpy: "ولم يكن هذا النمو مطرداً؛ إذ {dir:shape_dip_sign:ارتفعت|تراجعت} الواردات في عام {shape_dip_year} إلى {shape_dip_value:m1}، ثم شهدت ارتفاعاً ملحوظاً في عام {shape_jump_year}، واستمرت في الصعود حتى بلغت ذروتها في عام {shape_peak_year}."
  first_req_clause:
    select: unit_cost_provided
    variants:
      "no": " ويُعد المتطلب الأول متاحاً لدى المنشأة فوراً، ولا يمكن احتساب الجدوى المالية للدخول قبل استكماله."
      "yes": ""
  raw_cost_clause:
    # P3-4: ميزة تكلفة المنافسين تُصاغ بحسب ملف المصدّر.
    select: exporter_type
    variants:
      processor_of_imported_input: " دون تكلفة استيراد {commodity_raw_word}"
      agri_producer: " بميزة القرب الجغرافي من السوق"
      manufacturer: " بطاقة إنتاجية وقنوات توزيع قائمة"
  hub_counter_clause:
    select:
      - {when: "hub_name != none", use: with_hub}
      - {when: else, use: none}
    variants:
      with_hub: "، إلى جانب مركز إعادة تصدير في {hub_name} يمرر {hub_frac} السوق"
      none: ""
  nonequivalent_note:
    select: has_nonequivalent
    variants:
      "yes": " ولا تدخل الخلطات الرخيصة ضمن هذا النطاق لعدم تكافئها مع المنتج."
      "no": ""
  tariff_sentence:
    select: tariff_status
    variants:
      exempt: "يُعفى البند {hs} من الرسوم الجمركية بالكامل وفق جدول التعرفة {market_nisba_m}."
      rate: "يخضع البند {hs} لرسم جمركي بنسبة {tariff:pct0} وفق جدول التعرفة {market_nisba_m}."
      gap: "لم يُتحقق بعد من الرسم الجمركي المنطبق على البند {hs}."
  tariff_short:
    select: tariff_status
    variants:
      exempt: "إعفاء جمركي كامل"
      rate: "رسم جمركي بنسبة {tariff:pct0}"
      gap: "رسم جمركي لم يُتحقق منه بعد"
  inflation_read:
    # القراءة تتبع الأرقام: لا ضغط فقط حين النمو موجب والتضخم ≤ 3.5%.
    select: inflation_band
    variants:
      low: "، وهي مؤشرات لا تُظهر ضغطاً على القوة الشرائية"
      high: "، وهو مستوى قد يضغط على القوة الشرائية ويستدعي متابعة الأسعار"
  gov_stability:
    # «سوق مستقرة» حكمٌ لا يُطلق بلا مصدر: من ملف المعرفة المعتمد وحده.
    select: has_k_gov_stability
    variants:
      "yes": " {k:s7_gov.stability}"
      "no": ""
  world_price_note:
    select: has_k_world_price
    variants:
      "yes": "{k:s1_decomp.world_price_note}"
      "no": ""

llm_briefs:
  s2_survey: "فقرة عن سلوك المستهلك من استطلاع مرصود، بصيغ المعجم فقط، دون أي رقم لم يُمرَّر"
  s2_caveat: "تحفظ على تفسير بيانات الاستهلاك وشريحة المنتج الفعلية"
  s2_patterns: "أنماط الاستهلاك السائدة وموضع المنتج بينها"
  s3_local_competitors: "المنافسة المحلية بالأسماء المرصودة"
  s3_advantage: "الميزة التنافسية مشروطة بشرط الجدوى وأثر التصنيف؛ اقرن كل ميزة بشرط جدواها (كميات أو تكلفة أو تصنيف) أو قل صراحةً إنه لا يُعتد بها قبل التحقق"
  s3_freshness: "خصائص المنتج اللوجستية إن كانت ذات أثر"
  s7_commodity: "أسعار المادة الخام عالمياً وأثرها على المصدّر"
  s1_suppliers.hub_note: "طبيعة أكبر الموردين (منتج أم مركز إعادة تصدير) وأين تنحصر المنافسة الفعلية"
  s1_hub_trend.interpretation: "تفسير حذر لتغيّر حصة مركز إعادة التصدير دون بناء قرار عليه"
  s4_halal_channels: "اشتراطات منافذ التجزئة للشهادة، موسومةً معلومةً تجارية تحتاج تحققاً"
  s5_channel_para: "قناة الدخول الموصى بها واعتباراتها المستندة إلى ما سبق"
  s8_rationale: "لماذا لا تنقض الحجة المضادة التوصية: الشريحة والقناة وحجم المخاطرة"

blocks:
  # ── الترويسة ─────────────────────────────────────────────────────────
  - {type: heading, text: "# دراسة سوق تصديرية: {product_short} إلى {market}"}
  - type: list
    text: |-
      **المنتج:** {product_full} (البند الجمركي {hs})
      **بلد المنشأ:** {origin_ar}
      **السوق المستهدفة:** {market}
      **تاريخ الإعداد:** {prep_month:month} {prep_year}
      **أحدث سنة بيانات تجارية مكتملة:** {last_complete_year}
  - {type: rule}
  # ── الملخص التنفيذي ──────────────────────────────────────────────────
  - {type: heading, text: "## الملخص التنفيذي"}
  - text: "تُعد السوق {market_nisba} {c:market_def}{c:ease_clause}. فقد بلغت واردات {market} من هذا المنتج {shape_v_last:m1} في عام {shape_y_last}، {c:growth_clause}، في حين {c:tariff_clause}، ويتوزع الطلب على {supplier_count:count(دولة مورّدة, gen)} {c:dominance_clause}. وفي المقابل، {c:saudi_clause}، {c:top3_clause}."
  - text: "وبناءً على ذلك، توصي الدراسة بـ**{decision_word}**، يبدأ بشحنة تجريبية واحدة، ويُرجأ أي التزام إنتاجي إلى حين استيفاء {req_count:count(متطلب, gen)}: {requirements_inline}.{c:first_req_clause}"
    when: "decision == conditional"
  - text: "وبناءً على ذلك، توصي الدراسة بـ**{decision_word}** القرار إلى حين استكمال {req_count:count(متطلب, gen)}: {requirements_inline}. ولا يُتخذ قرار دخول قبل استيفائها."
    when: "decision == defer"
  - text: "وبناءً على ذلك، توصي الدراسة بـ**{decision_word}** السوق في الوقت الراهن، وتُعاد دراستها عند تغيّر أحد المعطيات التالية: {requirements_inline}."
    when: "decision == no_entry"
  - text: "وبناءً على ذلك، توصي الدراسة بـ**{decision_word}** السوق بشحنة تجريبية أولى، مع استكمال {req_count:count(متطلب, gen)} بالتوازي: {requirements_inline}."
    when: "decision == entry"
  - {type: rule}
  # ── أولاً ────────────────────────────────────────────────────────────
  - {type: heading, text: "## أولاً: حجم السوق واتجاهاته"}
  - text: "تشير بيانات الأمم المتحدة للتجارة إلى أن واردات {market} من {product_short} {dir:shape_g_first_last:ارتفعت|تراجعت} من {shape_v_first:m1} في عام {shape_y_first} إلى {shape_v_last:m1} في عام {shape_y_last}. {c:series_shape_clause} وقد سجلت الواردات {dir:last_yoy:نمواً|تراجعاً} بنسبة {last_yoy_abs:pct0} بين عامي {shape_y_prev} و{shape_y_last}، في حين لم يتجاوز نمو الناتج المحلي الإجمالي {market_nisba_gdp} {gdp_growth:pct1} خلال العام ذاته وفق تقديرات {gdp_source}."
  - select: dec_variant
    variants:
      decomposable_with_excluded_last: "ويتعين قراءة هذا النمو بحذر، لأنه نمو في القيمة يجمع أثر الكمية وأثر السعر معاً. فبين عامي {dec_y_a} و{dec_y_b} {dir:dec_dv:ارتفعت|تراجعت} القيمة بنسبة {dec_dv:pct0}، بينما {dir:dec_dp:ارتفع|تراجع} متوسط سعر الكيلوغرام المستورد بنسبة {dec_dp:pct0} (من {dec_p_a:usd1} إلى {dec_p_b:usd1} دولار)، أي أن الكمية المستوردة {dir:dec_dq:ارتفعت|تراجعت} بنحو {dec_dq:pct0} خلال الفترة، وتفسّر نحو {q_share_frac} نمو القيمة، ويعود الباقي إلى {dir:dec_dp:ارتفاع|تراجع} السعر. أما عام {dec_y_excl} فلا يمكن فصل أثر الكمية فيه عن أثر السعر لعدم موثوقية بيانات الوزن{c:world_price_note}. وعليه، فإن الاستنتاج المؤكد هو أن الكمية المستوردة {dir:dec_dq:نمت|انكمشت} بما يقارب {q_growth_frac} في {dec_span_years:count(سنة, gen)}، لا أن {dir:last_yoy:نمو|تراجع} الطلب بلغ {last_yoy_abs:pct0} في عام واحد؛ مع ملاحظة أن الواردات لا تمثل الطلب الكلي في سوق تنشط فيها {local_producers_word}."
      decomposable_full: "ويتعين قراءة هذا النمو بحذر، لأنه نمو في القيمة يجمع أثر الكمية وأثر السعر معاً. فبين عامي {dec_y_a} و{dec_y_b} {dir:dec_dv:ارتفعت|تراجعت} القيمة بنسبة {dec_dv:pct0}، بينما {dir:dec_dp:ارتفع|تراجع} متوسط سعر الكيلوغرام المستورد بنسبة {dec_dp:pct0} (من {dec_p_a:usd1} إلى {dec_p_b:usd1} دولار)، أي أن الكمية المستوردة {dir:dec_dq:ارتفعت|تراجعت} بنحو {dec_dq:pct0} خلال الفترة، وتفسّر نحو {q_share_frac} نمو القيمة، ويعود الباقي إلى {dir:dec_dp:ارتفاع|تراجع} السعر{c:world_price_note}. وعليه، فإن الاستنتاج المؤكد هو أن الكمية المستوردة {dir:dec_dq:نمت|انكمشت} بما يقارب {q_growth_frac} في {dec_span_years:count(سنة, gen)}، لا أن {dir:last_yoy:نمو|تراجع} الطلب بلغ {last_yoy_abs:pct0} في عام واحد؛ مع ملاحظة أن الواردات لا تمثل الطلب الكلي في سوق تنشط فيها {local_producers_word}."
      decomposable_down: "ويتعين قراءة هذا التراجع بحذر، لأنه تراجع في القيمة يجمع أثر الكمية وأثر السعر معاً. فبين عامي {dec_y_a} و{dec_y_b} تراجعت القيمة بنسبة {dec_dv_abs:pct0}، بينما {dir:dec_dp:ارتفع|تراجع} متوسط سعر الكيلوغرام المستورد بنسبة {dec_dp_abs:pct0} (من {dec_p_a:usd1} إلى {dec_p_b:usd1} دولار)، أي أن الكمية المستوردة تراجعت بنحو {dec_dq_abs:pct0} خلال الفترة، وتفسّر نحو {q_share_frac} تراجع القيمة، ويعود الباقي إلى {dir:dec_dp:ارتفاع|تراجع} السعر{c:world_price_note}. وعليه، فإن الاستنتاج المؤكد هو أن الكمية المستوردة انكمشت بما يقارب {q_growth_frac} في {dec_span_years:count(سنة, gen)}، لا أن {dir:last_yoy:نمو|تراجع} الطلب بلغ {last_yoy_abs:pct0} في عام واحد؛ مع ملاحظة أن الواردات لا تمثل الطلب الكلي في سوق تنشط فيها {local_producers_word}."
      value_up_price_down: "ويتعين قراءة هذا النمو بحذر، لأنه نمو في القيمة يجمع أثر الكمية وأثر السعر معاً. فبين عامي {dec_y_a} و{dec_y_b} ارتفعت القيمة بنسبة {dec_dv:pct0} بينما تراجع متوسط سعر الكيلوغرام المستورد بنسبة {dec_dp_abs:pct0} (من {dec_p_a:usd1} إلى {dec_p_b:usd1} دولار)، أي أن الكمية المستوردة ارتفعت بنحو {dec_dq:pct0} خلال الفترة، بما يفوق نمو القيمة نفسه. وعليه، فإن النمو المرصود نمو في الكمية بالدرجة الأولى، ويُقرأ بحذر لأن انخفاض السعر قد يعكس تحولاً نحو درجات أدنى أو تراجعاً في أسعار {commodity} عالمياً؛ مع ملاحظة أن الواردات لا تمثل الطلب الكلي في سوق تنشط فيها {local_producers_word}."
      value_down_price_up: "ويتعين قراءة هذا التراجع بحذر، لأنه تراجع في القيمة يجمع أثر الكمية وأثر السعر معاً. فبين عامي {dec_y_a} و{dec_y_b} تراجعت القيمة بنسبة {dec_dv_abs:pct0} بينما ارتفع متوسط سعر الكيلوغرام المستورد بنسبة {dec_dp:pct0} (من {dec_p_a:usd1} إلى {dec_p_b:usd1} دولار)، أي أن الكمية المستوردة تراجعت بنحو {dec_dq_abs:pct0} خلال الفترة، بما يفوق تراجع القيمة نفسه. وعليه، فإن الانكماش المرصود انكماش في الكمية بالدرجة الأولى؛ مع ملاحظة أن الواردات لا تمثل الطلب الكلي في سوق تنشط فيها {local_producers_word}."
      price_led: "ويتعين قراءة هذا {dir:dec_dv:النمو|التراجع} بحذر، لأنه {dir:dec_dv:نمو|تراجع} في القيمة يجمع أثر الكمية وأثر السعر معاً. فبين عامي {dec_y_a} و{dec_y_b} {dir:dec_dv:ارتفعت|تراجعت} القيمة بنسبة {dec_dv_abs:pct0} بينما {dir:dec_dp:ارتفع|تراجع} متوسط سعر الكيلوغرام بنسبة {dec_dp_abs:pct0}، أي أن الكمية {q_change_clause}؛ فالتغير المرصود سعري في المقام الأول لا {dir:dec_dv:توسّعاً|انكماشاً} في الطلب؛ مع ملاحظة أن الواردات لا تمثل الطلب الكلي في سوق تنشط فيها {local_producers_word}."
      not_decomposable: "ويتعين قراءة هذا {dir:shape_g_first_last:النمو|التراجع} بحذر، لأنه {dir:shape_g_first_last:نمو|تراجع} في القيمة يجمع أثر الكمية وأثر السعر معاً، ولا يمكن فصل أثر الكمية عن أثر السعر في هذه السلسلة {dec_reason}؛ وعليه لا يُقرأ الرقم {dir:shape_g_first_last:نمواً|تراجعاً} في الطلب."
  - {type: table, columns: ["السنة", "قيمة الواردات (مليون دولار)"], rows: imports_series}
  - text: "المصدر: {imports_source_line}"
  - text: "وعلى مستوى الدول المورّدة، تصدرت {sup1_name} القائمة في عام {sup_year} بحصة تقارب {sup1_share:pct0} من الواردات، تلتها {sup2_name} بنسبة {sup2_share:pct0}، ثم {sup3_name} بنسبة {sup3_share:pct0}، ف{sup4_name} بنسبة {sup4_share:pct0}. {k:s1_suppliers.hub_note}"
    when: "top_n >= 3"
  - select: hhi_band
    variants:
      below_1500: "ويُقدَّر مؤشر تركّز الموردين، محسوباً من الحصص المرصودة أعلاه، بما بين {hhi_lo_100:int} و{hhi_hi_100:int} نقطة من أصل 10,000، وهو ما يقل بوضوح عن العتبة التي تُصنَّف عندها السوق مركّزة (1,500 نقطة). وتعني هذه القراءة أن السوق مفتوحة أمام الموردين الجدد، مع منافسة سعرية فعلية من الموردين {origin_word}."
      straddles_1500: "ويُقدَّر مؤشر تركّز الموردين، محسوباً من الحصص المرصودة أعلاه، بما بين {hhi_lo_100:int} و{hhi_hi_100:int} نقطة من أصل 10,000، وهو نطاق يعبر عتبة التركّز (1,500 نقطة) فلا يُحسم من الحصص المرصودة وحدها ما إذا كانت السوق مفتوحة أم مركّزة؛ ويُستوضح ترتيب الموردين الكامل من المستورد المحلي قبل البناء على أي من القراءتين."
      between_1500_2500: "ويُقدَّر مؤشر تركّز الموردين، محسوباً من الحصص المرصودة أعلاه، بما بين {hhi_lo_100:int} و{hhi_hi_100:int} نقطة من أصل 10,000، وهو ما يقع ضمن نطاق التركّز المتوسط (1,500 إلى 2,500 نقطة). وتعني هذه القراءة أن الدخول ممكن، غير أن المورد الأكبر يملك وزناً تفاوضياً يتعين احتسابه."
      straddles_2500: "ويُقدَّر مؤشر تركّز الموردين، محسوباً من الحصص المرصودة أعلاه، بما بين {hhi_lo_100:int} و{hhi_hi_100:int} نقطة من أصل 10,000، وهو نطاق يعبر عتبة التركّز الشديد (2,500 نقطة) فلا يُحسم من الحصص المرصودة وحدها ما إذا كانت السوق متوسطة التركّز أم شديدته؛ ويُستوضح ترتيب الموردين الكامل من المستورد المحلي قبل البناء على أي من القراءتين."
      above_2500: "ويُقدَّر مؤشر تركّز الموردين، محسوباً من الحصص المرصودة أعلاه، بما بين {hhi_lo_100:int} و{hhi_hi_100:int} نقطة من أصل 10,000، وهو ما يتجاوز العتبة التي تُصنَّف عندها السوق شديدة التركّز (2,500 نقطة). وتعني هذه القراءة أن السوق محكومة بعدد محدود من الموردين، ويتوقف الدخول على انتزاع حصة من أحدهم أو على استهداف شريحة لا يخدمونها."
      not_computed: "ولم يتسنّ احتساب مؤشر تركّز الموردين لغياب حصص الموردين في بيانات {imports_source}، ولا تُقرأ هذه الفجوة سوقاً مفتوحة؛ ويمكن تقدير الحصص من بيانات الصادرات المقابلة لدى الدول المورّدة إن توفرت."
  - text: "وشهدت حصة {hub_trend_name} {dir:hub_trend_dir:ارتفاعاً|تراجعاً} من {hub_trend_share_a:pct0} في عام {hub_trend_y_a} إلى {hub_trend_share_b:pct0} في عام {hub_trend_y_b}، ثم {dir:hub_trend_dir_c:ارتفاعاً|تراجعاً} محدوداً إلى {hub_trend_share_c:pct0} وفق البيانات الأولية غير المكتملة لعام {hub_trend_y_c}. {k:s1_hub_trend.interpretation} وتبقى هذه إشارة سنتين لا يُبنى عليها قرار."
    when: hub_trend_sig
  - text: "أما متوسط سعر الاستيراد عند الحدود فقد {dir:uv_dir:ارتفع|تراجع} من {uv_first:usd1} دولار للكيلوغرام في عام {shape_y_first} إلى {uv_last:usd1} دولار في عام {dec_y_b}. وقد استُبعدت قيمة عام {uv_excl_year} نظراً لوجود خلل واضح في الوزن المسجل. ويُعد هذا السعر متوسطاً عاماً لواردات يغلب عليها {k:s1_border.commercial_word}، ولا يمثل مرجعاً لتسعير منتج مختص؛ وتقتصر فائدته على بيان المستوى الذي يبدأ منه المستورد {market_nisba_m} تفاوضه مع الموردين التقليديين."
    when: "uv_excl_year != none"
  - {type: rule}
  # ── ثانياً ───────────────────────────────────────────────────────────
  - {type: heading, text: "## ثانياً: خصائص الطلب وسلوك المستهلك"}
  - text: "{k:s2_survey}"
  - text: "{k:s2_caveat}"
  - text: "{k:s2_patterns}"
  - text: "وتشكّل نسبة المسلمين البالغة نحو {muslim_share:pct0} من سكان {market}، وفق تعداد {census_auth} لعام {census_year}، عاملاً داعماً للمنتج السعودي، شريطة أن يحمل شهادة حلال معترفاً بها من الجهات {market_nisba}، على النحو الموضح في قسم المتطلبات التنظيمية."
    when: halal_relevant
  - text: "ولم تتوفر ضمن المصادر المتاحة بيانات موثقة عن الموسمية في الطلب على هذا المنتج تحديداً، ويُوصى بالحصول عليها من الموزع المحلي عند بدء التفاوض."
  - {type: rule}
  # ── ثالثاً ───────────────────────────────────────────────────────────
  - {type: heading, text: "## ثالثاً: البيئة التنافسية والتسعير"}
  - text: "رُصدت أسعار التجزئة التالية لمنتجات مماثلة في السوق {market_nisba}:"
    when: has_shelf_rows
  - {type: table, columns: ["المنتج", "التصنيف", "السعر للكيلوغرام", "المصدر"], rows: shelf_prices}
  - text: "وعليه، يتراوح نطاق أسعار الرف للمنتجات غير المختصة بين {shelf_min:int} و{shelf_max:int} دولاراً للكيلوغرام، محسوباً على سعر صرف {shelf_fx:raw} {fx_cur_short} للدولار وفق بيانات {fx_source} لعام {shelf_fx_year}.{c:nonequivalent_note}"
  - text: "{k:s3_local_competitors}"
  - text: "{k:s3_advantage}"
  - text: "{k:s3_freshness}"
  - {type: rule}
  # ── رابعاً ───────────────────────────────────────────────────────────
  - {type: heading, text: "## رابعاً: المتطلبات التنظيمية ومسار الدخول"}
  - text: "**الرسوم والضرائب:** {c:tariff_sentence} وتُطبَّق ضريبة المبيعات (SST) عند الاستيراد بمعدل {sst_rule}، ويتعين تحديد المعدل المنطبق من جدول {sst_authority} قبل التسعير. ولا يُعتد بأي معاملة تفضيلية بموجب عضوية {pref_note}، لكون نظامها التفضيلي {pref_status}."
  - text: "**المتطلبات الإلزامية في السوق {market_nisba}:**"
    when: has_requirement_rows
  - {type: table, columns: ["المتطلب", "الجهة المختصة", "الطرف المسؤول", "آخر تحقق"], rows: requirements}
  - text: "**المتطلبات في المملكة قبل التصدير:** {exit_text}."
  - text: "**شهادة الحلال:** لا يُلزم القانون {market_nisba_m} المنتجات غير اللحمية بشهادة حلال. غير أن وسم المنتج بعبارة \"حلال\" يستلزم شهادة من جهة معترف بها لدى {halal_long}. {k:s4_halal_channels} وبالتالي، يمكن بدء الدخول دون الشهادة، غير أن التوسع في السوق يتوقف على الحصول عليها. ويسبق مسألة المدة سؤال أهم: هل توجد جهة اعتماد سعودية ضمن قائمة الجهات الأجنبية المعترف بها لدى {halal_short}، المنشورة على موقع {halal_site}؟ فإن وُجدت فالمسار قائم وتُستوضح مدته من تلك الجهة، وإن لم توجد فالاعتماد عبر جهة سعودية متعذر، ويلزم مسار بديل عبر جهة أجنبية معترف بها أو عبر {halal_short} مباشرة. ولم تُنشر مدد رسمية للاعتماد، ويُوصى ببدء الإجراءات فور اتخاذ قرار الدخول."
    when: "halal_mandatory == false"
  - text: "**المدة الإجمالية حتى أول شحنة:** لم تتوفر مدد رسمية لتصاريح الحجر أو اعتماد الحلال، وتُستوضح الأولى من {quarantine_agent}، والثانية من الجهة السعودية المدرجة لدى {halal_short} إن وُجدت، أو من {halal_short} مباشرة."
    when: "durations_published == false"
  - {type: rule}
  # ── خامساً ───────────────────────────────────────────────────────────
  - {type: heading, text: "## خامساً: قنوات التوزيع والجهات المستهدفة"}
  - text: "{k:s5_channel_para}"
  - text: "**الجهات المرصودة:**"
    when: has_entity_rows
  - {type: table, columns: ["الجهة", "الوصف", "الدور المقترح"], rows: entities}
  - text: "واستُبعد من القائمة {excluded_text} لعدم توفر ما يثبت تعاملهم في {product_short_bare}. ونظراً لأن الاعتماد على جهة واحدة يعرّض الخطة للتوقف عند رفضها، يُوصى بتحديد جهتين أو ثلاث إضافية {k:s5_directories} قبل بدء التفاوض، وهو ما يمثل المتطلب {entity_req_ordinal}."
    when: "entity_para == with_excluded"
  - text: "ونظراً لأن الاعتماد على جهة واحدة يعرّض الخطة للتوقف عند رفضها، يُوصى بتحديد جهتين أو ثلاث إضافية {directories_phrase} قبل بدء التفاوض، وهو ما يمثل المتطلب {entity_req_ordinal}."
    when: "entity_para == no_excluded"
  - text: "**اللوجستيات:** يُعد {port} ميناء الدخول الرئيسي، ويبلغ مؤشر الأداء اللوجستي لـ{market} {lpi:raw} من 5 وفق {fx_source} ({lpi_year}). ويستغرق الشحن البحري من موانئ المملكة {sea_days}، ولم تُوثق تكلفته، ويُوصى بالحصول على ثلاثة عروض من وكلاء الشحن."
  - {type: rule}
  # ── سادساً ───────────────────────────────────────────────────────────
  - {type: heading, text: "## سادساً: المؤشرات المالية"}
  - text: "تتيح البيانات المتاحة تحديد ما يلي: {c:tariff_short}، ومتوسط سعر استيراد عام لـ{k:s1_border.commercial_word_short} عند {uv_last:usd1} دولار للكيلوغرام لا يصلح مرجعاً لمنتج مختص، ونطاق أسعار رف للمنتجات غير المختصة يتراوح بين {shelf_min:int} و{shelf_max:int} دولاراً للكيلوغرام."
  - text: "أما احتساب حجم الشحنة التجريبية وكلفة الدخول ونقطة التعادل وأقصى خسارة محتملة، فيتوقف على تكلفة إنتاج الكيلوغرام ووزن العبوة لدى المنشأة، ولم تُدرج أي قيم افتراضية بديلة لتجنب الاعتماد عليها في اتخاذ القرار."
    when: "unit_cost_provided == false"
  - text: "ويمكن الاستناد إلى قاعدة تقديرية إلى حين إدخال التكلفة الفعلية: تستحوذ حلقتا التوزيع والتجزئة في القطاع الغذائي على ما بين {rule_low:pct0} و{rule_high:pct0} من سعر الرف، وبالتالي ينبغي ألا تتجاوز التكلفة الواصلة إلى {market} {landed_low:pct0} إلى {landed_high:pct0} من سعر الرف المستهدف."
    when: "unit_cost_provided == false"
  - text: "غير أن سعر الرف المستهدف نفسه لم يُرصد بعد. فالأسعار المتاحة تخص علامة عالمية جماهيرية ({shelf_max:int} دولاراً) وبناً تقليدياً لا ينافسه المنتج ({shelf_min:int} دولاراً)، بينما الشريحة المستهدفة هي {segment_word}، ويُتوقع أن تفوق أسعار {competitor_word} {shelf_max:int} دولاراً للكيلوغرام، وهو توقع يُتحقق منه ضمن المتطلب الثاني لا حقيقة مثبتة. وعليه، تُعتمد عتبة {threshold:int} دولاراً للتكلفة الواصلة حداً مؤقتاً مبنياً على أعلى سعر مرصود ({shelf_max:int} دولاراً)، بوصفه أدنى تقدير ممكن لسعر رف المنتج المختص، ومن المرجح أن تتسع بعد رصد سعر محمصة مختصة واحدة على الأقل (المتطلب الثاني). ولا يُتخذ قرار إرجاء على أساس هذه العتبة قبل استيفاء ذلك المتطلب."
    when: "segment_price_observed == false"
  - {type: rule}
  # ── سابعاً ───────────────────────────────────────────────────────────
  - {type: heading, text: "## سابعاً: المخاطر"}
  - text: "**سعر الصرف:** يبلغ متوسط سعر صرف {fx_cur} {fx_avg:raw} للدولار في عام {fx_year}، وبلغ الفارق بين أعلى وأدنى متوسط سنوي خلال الأعوام {fx_range_years} نحو {fx_range_pct:pct1} من المتوسط. ويُلاحظ أن التقلب داخل السنة الواحدة أكبر من ذلك بحسب بيانات الصرف اليومية، ويُوصى بمراجعة نطاق العام الأخير من مصدر رسمي قبل تحديد آلية التسعير. ويُوصى بالتسعير بالدولار مع بند مراجعة نصف سنوي، مع الإشارة إلى أن ضعف {fx_cur} ينعكس على أسعار الرف والطلب حتى مع التسعير بالدولار."
  - text: "**سعر الصرف:** لم تُدرج بيانات سعر صرف العملة المحلية في هذه النسخة لتعذر استرجاعها وقت الإعداد، ويتعين مراجعتها من مصدر رسمي قبل تحديد آلية التسعير."
    when: "fx_avg == none"
  - text: "**الاقتصاد الكلي:** سجل الاقتصاد {market_nisba_m} {dir:macro_gdp:نمواً|انكماشاً} بنسبة {macro_gdp_abs:pct1} في عام {macro_year} مع تضخم بنسبة {macro_inf:pct1}{c:inflation_read}."
  - text: "{k:s7_commodity}"
  - text: "**مؤشرات الحوكمة:** لم تُدرج مؤشرات الاستقرار السياسي وسيادة القانون الصادرة عن {fx_source} في هذه النسخة لتعذر استرجاعها وقت الإعداد، وهي مؤشرات منشورة للعموم تُستكمل في المراجعة التالية.{c:gov_stability}"
    when: "gov_available == false"
  - {type: rule}
  # ── ثامناً ───────────────────────────────────────────────────────────
  - {type: heading, text: "## ثامناً: الاعتبارات المضادة للتوصية"}
  - text: "تتمثل الحجة الأقوى ضد الدخول في الغياب التام لأي مورّد سعودي بين {supplier_count:count(دولة مورّدة, gen)}، وهو ما قد يدل على محاولات سابقة لم تُكلل بالنجاح. ويُعزز ذلك وجود منتجَين إقليميين، هما {producer1} و{producer2}، يستحوذان على {producers_two_frac} السوق{c:raw_cost_clause}{c:hub_counter_clause}، {k:s8_counter_local_taste}."
    when: "counter_kind == saudi_absent"
  - text: "تتمثل الحجة الأقوى ضد الدخول في استحواذ {top1_partner} على {top1_share:pct0} من الواردات، بما يمنح هذا المورد قدرة تسعيرية يصعب على مورّد جديد مجاراتها."
    when: "counter_kind == dominant_supplier"
  - text: "تتمثل الحجة الأقوى ضد الدخول في تراجع الواردات بنسبة تقارب {shape_g_abs:pct0} عن عام {shape_y_first}، وهو ما قد يدل على انكماش الطلب أو تحوّله إلى الإنتاج المحلي."
    when: "counter_kind == declining"
  - text: "تتمثل الحجة الأقوى ضد الدخول في مرور {hub_frac} الواردات عبر {hub_name} بوصفها مركز إعادة تصدير، بما يعني أن المنافسة الفعلية تجري على مستوى المنشأ لا الوسيط."
    when: "counter_kind == hub"
  - text: "لم تُرصد في البيانات المتاحة حجة مضادة راجحة للدخول، غير أن الخطر الرئيسي يبقى في المتطلبات غير المستوفاة الواردة أعلاه؛ وتنقلب هذه القراءة إذا تعذر استيفاء أي منها."
    when: "counter_kind == no_counter"
  - text: "ولم تُعتمد هذه الحجة أساساً للرفض لأنها تفترض المنافسة على السعر والذوق المحلي، وهو ما لا توصي به الدراسة. {k:s8_rationale} وفي حال تجاوزت التكلفة الواصلة الحد المشتق من سعر رف المحمصة المختصة بعد رصده، أو تعذر استيفاء عمر الرف الذي يشترطه الموزع، أو تبين عدم وجود مسار اعتماد حلال عبر جهة سعودية، فإن هذه الحجة تصبح راجحة ويكون الإرجاء هو القرار المناسب."
    when: "counter_follow == conditional"
  - text: "وتُعد هذه الحجة راجحة في ضوء المعطيات المتاحة، وهي أساس قرار {decision_word_gen}؛ وتنقلب إذا رُصد سعر رف من الشريحة المستهدفة يترك هامشاً كافياً بعد التكلفة الواصلة، أو ثبت وجود مسار اعتماد حلال عبر جهة سعودية خلال مدة معقولة."
    when: "counter_follow == defer"
  - text: "وتُعد هذه الحجة راجحة، وهي أساس قرار {decision_word_gen}؛ وتنقلب فقط بتغيّر جوهري في بنية الموردين أو في أسعار الرف المرصودة."
    when: "counter_follow == no_entry"
  - text: "وتنقلب هذه الاعتبارات إلى أساس للإرجاء إذا تجاوزت التكلفة الواصلة الحد المشتق من سعر الرف المرصود، أو تعذر استيفاء أي من المتطلبات الواردة أعلاه."
    when: "counter_follow == entry"
  - text: "ولم تُعتمد هذه الحجة أساساً للرفض لأن المسار المقترح محدود المخاطر ومشروط بالمتطلبات الواردة أعلاه؛ وتصبح راجحة ويكون الإرجاء هو القرار المناسب إذا تعذر استيفاء أي منها."
    when: "counter_follow == other_go"
  - text: "وتُعد هذه الحجة راجحة، وهي أساس قرار {decision_word_gen}؛ وتنقلب إذا تغيّرت المعطيات التي بُنيت عليها تغيّراً جوهرياً."
    when: "counter_follow == other_stop"
  - {type: rule}
